<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — Prepo Pixelado</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1e1b4b;
  font-family: "Baloo 2", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  gap: 24px; padding: 32px 16px; min-height: 100vh;
}
h1 { color: white; font-size: 12px; opacity: .45; text-transform: uppercase; letter-spacing: .12em; }

.modal {
  background: #fff; border-radius: 20px; padding: 20px 18px 16px;
  width: 300px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.modal-title { font-size: 17px; font-weight: 800; color: #1e1b4b; margin-bottom: 2px; }
.modal-sub   { font-size: 12px; color: #6b7280; margin-bottom: 14px; }

/* Stage */
.char-stage {
  position: relative; width: 200px; height: 240px;
  margin: 0 auto 14px;
}
#prepo-canvas {
  display: block; width: 200px; height: 240px;
  border-radius: 12px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* Glow ring final */
.char-stage.done #prepo-canvas {
  box-shadow: 0 0 0 3px #7C3AED, 0 0 40px rgba(124,58,237,.6);
  animation: ring-pulse 1.5s ease infinite;
}
@keyframes ring-pulse {
  0%,100% { box-shadow: 0 0 0 3px #7C3AED, 0 0 24px rgba(124,58,237,.4); }
  50%      { box-shadow: 0 0 0 5px #A78BFA, 0 0 52px rgba(167,139,250,.8); }
}

/* Flash de atividade desbloqueada */
.unlock-flash {
  position: absolute; inset: 0; border-radius: 12px;
  background: rgba(167,139,250,.35);
  pointer-events: none; opacity: 0;
  animation: flash-anim .5s ease forwards;
}
@keyframes flash-anim {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}

/* Barra de progresso */
.bar-wrap { background: #e5e7eb; border-radius: 99px; height: 8px; margin-bottom: 4px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 99px;
  background: linear-gradient(90deg,#7C3AED,#A78BFA);
  transition: width .6s cubic-bezier(.22,1,.36,1); }
.bar-label { font-size: 11px; color: #9ca3af; margin-bottom: 12px; }

/* Chips */
.pieces-strip { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 28px; margin-bottom: 10px; }
.piece-chip {
  background: #EDE9FE; border: 1.5px solid #7C3AED;
  border-radius: 8px; padding: 3px 10px;
  font-size: 11px; font-weight: 800; color: #5B21B6;
  animation: chip-in .35s cubic-bezier(.22,1,.36,1) both;
}
@keyframes chip-in {
  from { transform: scale(0) translateY(6px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* Carta */
.carta { display: none; background: #EDE9FE; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.carta.show { display: block; animation: chip-in .5s cubic-bezier(.22,1,.36,1) both; }
.carta-title { font-size: 13px; font-weight: 800; color: #1e1b4b; margin-bottom: 4px; }
.carta-char  { font-size: 13px; font-weight: 800; color: #5B21B6; }
.carta-badge { display: inline-block; background: #7C3AED; color: #fff;
  padding: 2px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; margin-top: 4px; }

/* Botão */
.btn {
  background: linear-gradient(135deg,#7C3AED,#A78BFA);
  color: #fff; border: none; border-radius: 50px;
  padding: 10px; font-size: 13px; font-weight: 800;
  cursor: pointer; width: 100%; font-family: inherit; transition: opacity .2s;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn:hover:not(:disabled) { opacity: .88; }

/* Controles */
.controls { display: flex; gap: 8px; }
.ctrl-btn {
  background: rgba(255,255,255,.1); color: white;
  border: 1.5px solid rgba(255,255,255,.2);
  border-radius: 10px; padding: 8px 16px; font-size: 12px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: .15s;
}
.ctrl-btn:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<h1>Mockup &mdash; Prepo Pixelado &middot; Reveal Progressivo</h1>

<div class="modal">
  <div class="modal-title" id="modal-title">&#128274; ??? aguarda revela&ccedil;&atilde;o</div>
  <div class="modal-sub"   id="modal-sub">Preposicoes &middot; 0 de 8 atividades</div>

  <div class="char-stage" id="char-stage">
    <canvas id="prepo-canvas" width="200" height="240"></canvas>
  </div>

  <div class="pieces-strip" id="pieces-strip"></div>

  <div class="carta" id="carta">
    <div class="carta-title">&#127183; Carta desbloqueada!</div>
    <div class="carta-char">Prepo &mdash; O Rob&ocirc; das Preposicoes</div>
    <div class="carta-badge">&#128995; &Eacute;pica</div>
  </div>

  <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  <div class="bar-label" id="bar-label">0 / 8 atividades</div>

  <button class="btn" id="btn" onclick="doActivity()">&#9654; Fazer atividade 1 de 8</button>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="resetAll()">&#8635; Reiniciar</button>
  <button class="ctrl-btn" onclick="skipAll()">&#9889; Revelar tudo</button>
</div>

<script>
// ─── Estágios de revelação (9 estados: início + 8 atividades) ────────────────
// pixelSize: tamanho do bloco em pixels (1 = nítido)
// gray:      porcentagem de escala de cinza (0 = cor plena)
// bright:    brilho (100 = normal; menor = mais escuro)
// Curva exponencial: fica irreconhecível até a atividade 6, revela na 7-8
var STAGES = [
  { pixelSize: 42, gray: 100, bright: 38 },  // 0 — bloqueado (massa escura)
  { pixelSize: 38, gray: 100, bright: 42 },  // 1
  { pixelSize: 34, gray: 100, bright: 46 },  // 2
  { pixelSize: 30, gray: 95,  bright: 50 },  // 3
  { pixelSize: 26, gray: 88,  bright: 55 },  // 4
  { pixelSize: 20, gray: 78,  bright: 61 },  // 5
  { pixelSize: 13, gray: 55,  bright: 72 },  // 6 — vaga silhueta
  { pixelSize:  4, gray: 15,  bright: 90 },  // 7 — quase lá (salto dramático)
  { pixelSize:  1, gray:  0,  bright: 100 }, // 8 — revelação total
];

var MAX_ACT   = 8;
var activity  = 0;
var busy      = false;
var img       = new Image();
var canvas    = document.getElementById('prepo-canvas');
var ctx       = canvas.getContext('2d');

// Animação de transição entre estágios
var animFrom  = STAGES[0];
var animTo    = STAGES[0];
var animT     = 1;           // 0..1; quando 1 = parado no destino
var animRAF   = null;
var ANIM_DUR  = 700;         // ms da transição (sobrescrito dinamicamente)
var animStart = 0;

function lerp(a, b, t) { return a + (b - a) * t; }

// Ease out cubic
function ease(t) { return 1 - Math.pow(1 - t, 3); }

function drawFrame() {
  var now  = performance.now();
  var raw  = Math.min(1, (now - animStart) / ANIM_DUR);
  var t    = ease(raw);

  var ps   = lerp(animFrom.pixelSize, animTo.pixelSize, t);
  var gray = lerp(animFrom.gray,      animTo.gray,      t);
  var br   = lerp(animFrom.bright,    animTo.bright,    t);

  renderPixelated(Math.max(1, Math.round(ps)), gray, br);

  if (raw < 1) {
    animRAF = requestAnimationFrame(drawFrame);
  } else {
    animRAF = null;
    animFrom = animTo;
    animT = 1;
  }
}

function transitionTo(stageIndex) {
  // Atividades 7 e 8 = reveal dramático, animação mais lenta
  ANIM_DUR = stageIndex >= 7 ? 1500 : 700;
  animFrom = { pixelSize: animFrom.pixelSize, gray: animFrom.gray, bright: animFrom.bright };
  // captura estado atual interpolado
  if (animRAF) {
    cancelAnimationFrame(animRAF);
    var now = performance.now();
    var raw = Math.min(1, (now - animStart) / ANIM_DUR);
    var t   = ease(raw);
    animFrom = {
      pixelSize: lerp(animFrom.pixelSize, animTo.pixelSize, t),
      gray:      lerp(animFrom.gray,      animTo.gray,      t),
      bright:    lerp(animFrom.bright,    animTo.bright,    t),
    };
  }
  animTo    = STAGES[stageIndex];
  animStart = performance.now();
  animRAF   = requestAnimationFrame(drawFrame);
}

function renderPixelated(pixelSize, grayPct, brightPct) {
  if (!img.complete || !img.naturalWidth) return;

  var W = canvas.width;   // 200
  var H = canvas.height;  // 240

  if (pixelSize <= 1) {
    // Nítido — desenha direto
    ctx.clearRect(0, 0, W, H);
    ctx.filter = 'grayscale(' + grayPct + '%) brightness(' + brightPct + '%)';
    ctx.drawImage(img, 0, 0, W, H);
    ctx.filter = 'none';
    return;
  }

  // 1) Desenha na resolução reduzida
  var sw   = Math.ceil(W / pixelSize);
  var sh   = Math.ceil(H / pixelSize);
  var off  = document.createElement('canvas');
  off.width  = sw;
  off.height = sh;
  var octx = off.getContext('2d');
  octx.filter = 'grayscale(' + grayPct + '%) brightness(' + brightPct + '%)';
  octx.drawImage(img, 0, 0, sw, sh);

  // 2) Amplia sem suavização → blocos pixelados
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
}

// ─── Imagem carregada ────────────────────────────────────────────────────────
img.onload = function() {
  renderPixelated(STAGES[0].pixelSize, STAGES[0].gray, STAGES[0].bright);
};
img.src = '_landing/prepo-hd.png';

// ─── Ação principal ──────────────────────────────────────────────────────────
function doActivity() {
  if (busy || activity >= MAX_ACT) return;
  busy = true;
  activity++;

  // Flash na imagem
  var flash = document.createElement('div');
  flash.className = 'unlock-flash';
  document.getElementById('char-stage').appendChild(flash);
  setTimeout(function(){ flash.remove(); }, 500);

  // Transição para o próximo estágio
  transitionTo(activity);

  // UI
  var coverage = activity / MAX_ACT;
  document.getElementById('bar').style.width = Math.round(coverage * 100) + '%';
  document.getElementById('bar-label').textContent = activity + ' / ' + MAX_ACT + ' atividades';

  // Chip descritivo do estágio
  var strip = document.getElementById('pieces-strip');
  strip.innerHTML = '';
  var chip = document.createElement('span');
  chip.className = 'piece-chip';
  chip.textContent = stageLabel(activity);
  strip.appendChild(chip);

  if (activity >= MAX_ACT) {
    setTimeout(finishComplete, 1000);
  } else {
    document.getElementById('modal-title').textContent = '✨ Ficou mais nítido!';
    document.getElementById('modal-sub').textContent =
      'Preposicoes · ' + activity + ' de ' + MAX_ACT + ' atividades';
    document.getElementById('btn').textContent =
      '▶ Fazer atividade ' + (activity + 1) + ' de ' + MAX_ACT;
    busy = false;
  }
}

function stageLabel(n) {
  var labels = [
    '', // 0 (unused)
    'Quase nada...', 'Algo está se formando...', 'Uma figura misteriosa!',
    'Tomando forma...', 'Quem será?', 'Quase lá!',
    'Só falta um toque...', 'Revelado!'
  ];
  return labels[n] || '';
}

function finishComplete() {
  document.getElementById('char-stage').classList.add('done');
  document.getElementById('modal-title').textContent = '🎉 Personagem revelado!';
  document.getElementById('modal-sub').textContent = 'Você completou todas as atividades!';
  document.getElementById('pieces-strip').innerHTML = '';
  setTimeout(function() {
    document.getElementById('carta').classList.add('show');
    var btn = document.getElementById('btn');
    btn.textContent = '→ Ver minha coleção';
    btn.disabled = false;
    busy = false;
  }, 600);
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function skipAll() {
  if (activity >= MAX_ACT) return;
  activity = MAX_ACT;
  transitionTo(MAX_ACT);
  document.getElementById('bar').style.width = '100%';
  document.getElementById('bar-label').textContent = MAX_ACT + ' / ' + MAX_ACT + ' atividades';
  document.getElementById('pieces-strip').innerHTML = '';
  setTimeout(finishComplete, 1000);
}

function resetAll() {
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  activity = 0; busy = false;
  animFrom = STAGES[0]; animTo = STAGES[0];

  renderPixelated(STAGES[0].pixelSize, STAGES[0].gray, STAGES[0].bright);
  document.getElementById('char-stage').classList.remove('done');
  document.getElementById('modal-title').textContent = '🔒 ??? aguarda revelação';
  document.getElementById('modal-sub').textContent = 'Preposicoes · 0 de ' + MAX_ACT + ' atividades';
  document.getElementById('pieces-strip').innerHTML = '';
  document.getElementById('carta').classList.remove('show');
  document.getElementById('bar').style.width = '0%';
  document.getElementById('bar-label').textContent = '0 / ' + MAX_ACT + ' atividades';
  var btn = document.getElementById('btn');
  btn.textContent = '▶ Fazer atividade 1 de ' + MAX_ACT;
  btn.disabled = false;
}
</script>
</body>
</html>
