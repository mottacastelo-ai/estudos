<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete a Lacuna — Poema Visual e Onomatopeias</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --port: #7C3AED; --port-light: #A78BFA; --port-bg: #F3F0FF; --port-dark: #4C1D95;
  --text: #1A1A2E; --muted: #6B7280; --border: #DDD6FE; --card: #fff; --radius: 18px;
  --green: #059669; --green-bg: #D1FAE5;
  --red: #DC2626; --red-bg: #FEE2E2;
}
body { font-family: "Baloo 2", cursive; background: var(--port-bg); color: var(--text); min-height: 100vh; padding: 20px 16px 80px; }
.wrap { max-width: 700px; margin: 0 auto; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--port); text-decoration: none; margin-bottom: 16px; }
.back-link:hover { opacity: .75; }
.activity-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 24px rgba(124,58,237,.1); }
.card-header { background: linear-gradient(135deg, #4C1D95, #7C3AED 60%, #A78BFA); padding: 20px 24px 18px; display: flex; align-items: center; gap: 14px; }
.card-header .hicon { font-size: 32px; }
.card-header h1 { font-family: "Space Mono", monospace; font-size: 17px; color: #fff; line-height: 1.2; }
.card-header p { font-size: 12px; color: rgba(255,255,255,.8); margin-top: 2px; font-weight: 600; }
.hbadge { margin-left: auto; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.instrucao { padding: 14px 20px; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.6; border-bottom: 2px solid var(--border); background: var(--port-bg); }
.instrucao strong { color: var(--text); }
.prog-area { padding: 12px 20px 0; }
.prog-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.prog-track { height: 7px; background: var(--port-bg); border-radius: 999px; overflow: hidden; }
.prog-fill { height: 7px; background: linear-gradient(90deg, var(--port), var(--port-light)); border-radius: 999px; transition: width .4s; }
.question-wrap { padding: 20px 20px 10px; }
.q-num { font-size: 11px; font-weight: 800; color: var(--port); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
.sentence-box { background: var(--port-bg); border: 2px solid var(--border); border-radius: 14px; padding: 16px 18px; font-size: 16px; font-weight: 700; line-height: 1.8; color: var(--text); margin-bottom: 14px; }
.sentence-box em { font-style: normal; color: var(--port); font-weight: 800; }
.words-area { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px 14px; }
.word-chip { padding: 9px 18px; border: 2px solid var(--border); border-radius: 999px; background: var(--card); font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: all .15s; }
.word-chip:hover:not(:disabled) { border-color: var(--port-light); background: var(--port-bg); color: var(--port); }
.word-chip:disabled { opacity: .45; cursor: default; }
.word-chip.selected { border-color: var(--port); background: var(--port-bg); color: var(--port); }
.word-chip.used { opacity: .35; pointer-events: none; }
.feedback { margin: 0 20px 14px; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 1.5; display: none; }
.feedback.correct { background: var(--green-bg); border: 2px solid var(--green); color: #065F46; }
.feedback.wrong { background: var(--red-bg); border: 2px solid var(--red); color: #991B1B; }
.check-btn { display: block; margin: 0 20px 16px; padding: 11px 24px; background: linear-gradient(135deg, var(--port), var(--port-light)); color: #fff; border: none; border-radius: 999px; font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 800; cursor: pointer; display: none; }
.next-btn { display: block; margin: 0 20px 20px; padding: 11px 24px; background: linear-gradient(135deg, var(--port), var(--port-light)); color: #fff; border: none; border-radius: 999px; font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 800; cursor: pointer; display: none; }
.blank { display: inline-block; min-width: 100px; border-bottom: 3px solid var(--port); padding: 0 6px; color: var(--port-dark); font-weight: 800; font-style: normal; text-align: center; cursor: pointer; transition: background .15s; border-radius: 4px; }
.blank:hover { background: #EDE9FE; }
.blank.filled { background: #EDE9FE; border-color: var(--port-light); }
.blank.correct-blank { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.blank.wrong-blank { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.result-panel { padding: 28px 24px; text-align: center; display: none; }
.result-emoji { font-size: 52px; margin-bottom: 10px; }
.score-big { font-size: 44px; font-weight: 900; color: var(--port); }
.result-title { font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700; color: var(--port); margin: 6px 0 4px; }
.result-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 16px; }
.restart-btn { padding: 12px 32px; background: linear-gradient(135deg, var(--port), var(--port-light)); color: #fff; border: none; border-radius: 999px; font-family: "Baloo 2", cursive; font-size: 15px; font-weight: 800; cursor: pointer; }
@media (max-width: 480px) {
  .sentence-box { font-size: 14px; }
  .word-chip { font-size: 13px; padding: 8px 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../index.html" onclick="voltarAoPortal(); return false;">← Voltar ao portal</a>
  <div class="activity-card">
    <div class="card-header">
      <div class="hicon">✍️</div>
      <div><h1>Complete a Lacuna</h1><p>Poema Visual e Onomatopeias</p></div>
      <div class="hbadge">7 frases</div>
    </div>
    <div class="instrucao">
      <strong>Como fazer:</strong> Clique na lacuna (<span style="border-bottom:2px solid var(--port);padding:0 6px;">___</span>)
      e depois clique na palavra correta entre as opções. Cada palavra só pode ser usada uma vez por frase!
    </div>
    <div class="prog-area">
      <div class="prog-label" id="prog-label">Frase 1 de 7</div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div id="main-area">
      <div class="question-wrap">
        <div class="q-num" id="q-num">Frase 1</div>
        <div class="sentence-box" id="sentence-box"></div>
      </div>
      <div class="words-area" id="words-area"></div>
      <div class="feedback" id="feedback-box"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()"></button>
    </div>
    <div class="result-panel" id="result-panel">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="score-big" id="score-big"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <button class="restart-btn" onclick="restartGame()">Tentar novamente</button>
    </div>
  </div>
</div>
<script>
var QUESTIONS = [
  {
    before: 'O poema visual é diferente do poema tradicional. No poema visual, o autor usa palavras e imagens e estabelece uma',
    blank: 'relação de sentido',
    after: 'entre elas.',
    opts: ['relação de sentido', 'rima perfeita', 'divisão em estrofes', 'pontuação especial'],
    feedback: 'Correto! A definição exata do livro: "o autor usa palavras e imagens e estabelece uma relação de sentido entre elas."'
  },
  {
    before: 'No poema visual, o autor usa a',
    blank: 'disposição das palavras',
    after: 'para formar imagens relacionadas ao sentido do texto.',
    opts: ['disposição das palavras', 'quantidade de sílabas', 'escolha das rimas', 'tamanho das estrofes'],
    feedback: 'Certo! É a disposição — ou seja, a organização — das palavras na página que cria a imagem visual no poema.'
  },
  {
    before: 'Uma onomatopeia é uma palavra que',
    blank: 'imita ou representa',
    after: 'um som.',
    opts: ['imita ou representa', 'inventa e cria', 'esconde e disfarça', 'rima e compara'],
    feedback: 'Exato! A onomatopeia imita ou representa um som — como "zzz" para o som de dormir.'
  },
  {
    before: 'No poema "Canção para ninar gato com insônia", as palavras',
    blank: 'ron ron ron',
    after: 'estão dispostas em espiral, formando a imagem de um gato enrolado dormindo.',
    opts: ['ron ron ron', 'zig e zag', 'miau miau', 'zum zum'],
    feedback: 'Certo! "ron ron ron" é a onomatopeia do ronronar do gato, disposta em espiral para formar sua imagem.'
  },
  {
    before: 'O poema do gato sugere',
    blank: 'imobilidade',
    after: ', porque retrata um gato enrolado e quieto, com o som de sono.',
    opts: ['imobilidade', 'movimento', 'velocidade', 'agitação'],
    feedback: 'Correto! O gato enrolado e as onomatopeias "ron ron ron" e "zzz" transmitem a ideia de imobilidade e sono.'
  },
  {
    before: 'No poema "zig e zag saíram...", as palavras "zig" e "zag" se repetem e formam a imagem de dois',
    blank: 'peixes',
    after: 'que nadam em zigue-zague.',
    opts: ['peixes', 'gatos', 'pássaros', 'insetos'],
    feedback: 'Certo! As palavras "zig" e "zag" alternadas formam a imagem de dois peixes — essa é a relação entre palavras e imagem no poema visual.'
  },
  {
    before: 'Os peixes "zig" e "zag" saíram sem direção e sumiram no horizonte',
    blank: 'sem chegar à conclusão',
    after: ', pois não concordavam sobre o caminho a seguir.',
    opts: ['sem chegar à conclusão', 'depois de descansar', 'com muito sucesso', 'em linha reta'],
    feedback: 'Exato! O poema diz que os peixes "sumiram no horizonte sem chegar à conclusão" — eles nunca chegaram a um acordo.'
  }
];

var currentQ = 0;
var acertos = 0;
var selectedBlank = false;
var selectedWord = null;
var answered = false;

function renderQuestion() {
  var q = QUESTIONS[currentQ];
  document.getElementById('prog-label').textContent = 'Frase ' + (currentQ+1) + ' de ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = ((currentQ / QUESTIONS.length) * 100) + '%';
  document.getElementById('q-num').textContent = 'Frase ' + (currentQ+1);

  var box = document.getElementById('sentence-box');
  box.innerHTML = q.before + ' <span class="blank" id="blank-span" onclick="clickBlank()">___</span> ' + q.after;

  var area = document.getElementById('words-area');
  area.innerHTML = '';
  var shuffled = q.opts.slice().sort(function(){ return Math.random() - .5; });
  shuffled.forEach(function(w) {
    var chip = document.createElement('button');
    chip.className = 'word-chip';
    chip.textContent = w;
    chip.addEventListener('click', function() { selectWord(w, chip); });
    area.appendChild(chip);
  });

  var fb = document.getElementById('feedback-box');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('next-btn').style.display = 'none';
  selectedBlank = false; selectedWord = null; answered = false;
}

function clickBlank() {
  if (answered) return;
  selectedBlank = true;
  if (selectedWord) { confirmAnswer(); }
}

function selectWord(word, chipEl) {
  if (answered) return;
  document.querySelectorAll('.word-chip').forEach(function(c){ c.classList.remove('selected'); });
  chipEl.classList.add('selected');
  selectedWord = word;
  if (selectedBlank) { confirmAnswer(); }
  else {
    var blankEl = document.getElementById('blank-span');
    if (blankEl) { blankEl.textContent = word; blankEl.classList.add('filled'); }
    if (selectedBlank) { confirmAnswer(); }
    else { selectedBlank = true; confirmAnswer(); }
  }
}

function confirmAnswer() {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[currentQ];
  var isCorrect = selectedWord === q.blank;
  if (isCorrect) acertos++;

  var blankEl = document.getElementById('blank-span');
  if (blankEl) {
    blankEl.textContent = selectedWord || '___';
    blankEl.classList.remove('filled');
    blankEl.classList.add(isCorrect ? 'correct-blank' : 'wrong-blank');
  }

  document.querySelectorAll('.word-chip').forEach(function(c){
    c.disabled = true;
    if (c.textContent === q.blank) c.style.opacity = '1';
  });

  var fb = document.getElementById('feedback-box');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = (isCorrect ? '✓ ' : '✗ ') + q.feedback;
  fb.style.display = 'block';

  var nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = currentQ < QUESTIONS.length - 1 ? 'Próxima frase →' : 'Ver resultado';
}

function nextQuestion() {
  currentQ++;
  if (currentQ < QUESTIONS.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  var pct = Math.round((acertos / QUESTIONS.length) * 100);
  window.sabendoScore = pct;
  document.getElementById('main-area').style.display = 'none';
  document.getElementById('result-panel').style.display = 'block';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = 'Concluído!';
  document.getElementById('score-big').textContent = acertos + '/' + QUESTIONS.length;
  var emoji, title, sub;
  if (pct >= 86) { emoji = '🌟'; title = 'Dominou o vocabulário!'; sub = 'Você conhece perfeitamente os termos dos poemas visuais e onomatopeias!'; }
  else if (pct >= 57) { emoji = '✨'; title = 'Muito bem!'; sub = 'Você entende bem os conceitos de poema visual e onomatopeia.'; }
  else { emoji = '💪'; title = 'Continue treinando!'; sub = 'Releia a definição de poema visual e os dois poemas de Capparelli.'; }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub;
}

function restartGame() {
  currentQ = 0; acertos = 0; answered = false; selectedBlank = false; selectedWord = null;
  document.getElementById('main-area').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
  renderQuestion();
}

renderQuestion();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "port";
  var THEME_SLUG = "poema-visual-onomatopeias";
  var ACTIVITY_TYPE = "complete-lacuna";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Ziguinho",
    characterEmoji: "🔤",
    characterImg:   "chars/poema-visual-onomatopeias-hd.png",
    themeLabel:     "Poema Visual e Onomatopeias · Português",
    totalActivities: 4,
    primaryColor: "#7C3AED",
    lightColor: "#A78BFA",
    bgColor: "#F3F0FF",
    glowRgb: "124,58,237",
    backUrl: "../../index.html#theme-port-poema-visual-onomatopeias",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;
    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#7C3AED,#A78BFA)"; btn.disabled = false; }, 3000);
      return;
    }
    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];
    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;
    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });
    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }
    btn.style.display = "none";
    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
