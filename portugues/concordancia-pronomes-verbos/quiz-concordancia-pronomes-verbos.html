<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Concordância entre Pronomes e Verbos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --port:#7C3AED;--port-light:#A78BFA;--port-bg:#F3F0FF;--port-dark:#4C1D95;
  --text:#1A1A2E;--muted:#6B7280;--border:#DDD6FE;--card:#fff;--radius:18px;
  --green:#10B981;--red:#EF4444;--green-bg:#D1FAE5;--red-bg:#FEE2E2;
}
body{font-family:"Baloo 2",cursive;background:var(--port-bg);color:var(--text);min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:640px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--port);text-decoration:none;margin-bottom:14px}
.back-link:hover{opacity:.7}
.card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 24px rgba(124,58,237,.1)}
.card-header{background:linear-gradient(135deg,#4C1D95,#7C3AED 60%,#A78BFA);padding:18px 20px 16px;display:flex;align-items:center;gap:12px}
.card-header .hico{font-size:28px;line-height:1}
.card-header h1{font-family:"Space Mono",monospace;font-size:15px;color:#fff;line-height:1.2}
.card-header p{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:600}
.hbadge{margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}

/* scorebar */
.scorebar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:2px solid var(--border);background:#faf9ff}
.sb-item{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--port-dark)}
.sb-val{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;color:var(--port)}
.sb-sep{width:1px;height:18px;background:var(--border)}

/* progress */
.prog-wrap{padding:12px 20px 0}
.prog-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.prog-track{height:8px;border-radius:999px;background:var(--border)}
.prog-fill{height:8px;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#A78BFA);transition:width .4s}

/* dots */
.dots{display:flex;gap:4px;padding:8px 20px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:999px;background:var(--border);transition:all .2s;flex-shrink:0}
.dot.current{background:var(--port);transform:scale(1.2)}
.dot.done-ok{background:var(--green)}
.dot.done-err{background:var(--red)}

/* question */
.question-area{padding:16px 20px}
.q-badge{display:inline-flex;align-items:center;gap:5px;background:var(--port-bg);color:var(--port-dark);font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:10px;letter-spacing:.05em}
.q-text{font-size:15px;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:14px}
.q-text em{color:var(--port);font-style:normal;font-weight:800}
.options{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px 16px;font-family:"Baloo 2",cursive;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:var(--port-light);background:var(--port-bg)}
.opt-letter{width:26px;height:26px;border-radius:999px;background:var(--port-bg);color:var(--port);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:"Space Mono",monospace}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .opt-letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .opt-letter{background:var(--red);color:#fff}
.opt:disabled{cursor:not-allowed}

/* feedback */
.feedback-box{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.5;display:none}
.feedback-box.show{display:flex;gap:8px;align-items:flex-start}
.feedback-box.fb-ok{background:var(--green-bg);color:#065F46;border:1.5px solid #6EE7B7}
.feedback-box.fb-err{background:var(--red-bg);color:#991B1B;border:1.5px solid #FCA5A5}
.fb-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.btn-next{display:none;margin-top:12px;width:100%;padding:13px;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff;border:none;border-radius:14px;font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;cursor:pointer;transition:all .15s}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,.4)}
.btn-next.show{display:block}

/* results */
.results{display:none;padding:24px 20px;text-align:center}
.results.show{display:block}
.res-emoji{font-size:52px;margin-bottom:10px}
.res-title{font-family:"Space Mono",monospace;font-size:18px;font-weight:700;color:var(--port-dark);margin-bottom:6px}
.res-sub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:20px}
.medal-badge{display:inline-flex;align-items:center;gap:6px;background:var(--port-bg);border:2px solid var(--port-light);color:var(--port-dark);font-size:13px;font-weight:800;padding:6px 16px;border-radius:999px;margin-bottom:20px}
.review-list{text-align:left;margin-bottom:18px}
.rev-item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:5px;font-size:13px;font-weight:600}
.rev-item.ok{background:var(--green-bg);color:#065F46}
.rev-item.err{background:var(--red-bg);color:#991B1B}
.rev-ico{flex-shrink:0;font-size:14px}
.btn-restart{margin-top:8px;padding:12px 24px;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff;border:none;border-radius:14px;font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;cursor:pointer}
.btn-restart:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,.4)}

@media(max-width:480px){
  .card-header h1{font-size:13px}
  .q-text{font-size:14px}
  .opt{font-size:13px;padding:10px 12px}
  .res-title{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../index.html" onclick="voltarAoPortal();return false;">← Voltar ao portal</a>
  <div class="card">
    <div class="card-header">
      <div class="hico">🔗</div>
      <div><h1>Quiz</h1><p>Concordância entre Pronomes e Verbos</p></div>
      <div class="hbadge">10 questões</div>
    </div>
    <div class="scorebar">
      <div class="sb-item">Pontos <span class="sb-val" id="sb-score">0</span></div>
      <div class="sb-sep"></div>
      <div class="sb-item">Acertos <span class="sb-val" id="sb-hits">0</span></div>
    </div>
    <div id="quiz-area">
      <div class="prog-wrap">
        <div class="prog-label" id="prog-label">Questão 1 de 10</div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="question-area" id="question-area">
        <div class="q-badge" id="q-badge">QUESTÃO 1</div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
        <div class="feedback-box" id="feedback-box"></div>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Próxima questão →</button>
      </div>
    </div>
    <div class="results" id="results">
      <div class="res-emoji" id="res-emoji"></div>
      <div class="res-title" id="res-title"></div>
      <div class="res-sub" id="res-sub"></div>
      <div class="medal-badge" id="medal"></div>
      <div class="review-list" id="review-list"></div>
      <button class="btn-restart" onclick="restartQuiz()">↺ Tentar novamente</button>
    </div>
  </div>
</div>

<script>
var QUESTIONS = [
  {
    text: 'Qual pronome pessoal corresponde à <em>1ª pessoa do singular</em>?',
    opts: ['Nós','Tu','Vós','Eu'],
    correct: 3,
    expl: '"Eu" é o pronome da 1ª pessoa do singular — representa quem fala sozinho.'
  },
  {
    text: 'O verbo <em>"abrem"</em> concorda com qual pronome pessoal?',
    opts: ['Eu','Tu','Ele/ela','Eles/elas'],
    correct: 3,
    expl: '"Abrem" é a forma do verbo "abrir" no presente para a 3ª pessoa do plural — eles/elas abrem.'
  },
  {
    text: 'Qual é a forma correta do verbo <em>"viver"</em> no passado para o pronome <em>"tu"</em>?',
    opts: ['Vivemos','Viveu','Viveste','Viveram'],
    correct: 2,
    expl: 'Para "tu" (2ª pessoa do singular) no passado, o verbo "viver" se flexiona em "viveste".'
  },
  {
    text: 'O pronome <em>"vós"</em> corresponde a qual pessoa e número?',
    opts: ['3ª pessoa do plural','2ª pessoa do singular','1ª pessoa do plural','2ª pessoa do plural'],
    correct: 3,
    expl: '"Vós" é o pronome da 2ª pessoa do plural — representa um grupo de pessoas com quem se fala.'
  },
  {
    text: 'Trecho do livro: "Como <em>eles</em> são bem grandes, [...] eles se sentem protegidos." O pronome "eles" retoma qual substantivo do texto?',
    opts: ['A casinha','O ato de proteger','Os cães','Um ao outro'],
    correct: 2,
    expl: '"Eles" retoma "os cães" (plural). Por isso o pronome e o verbo também ficam no plural — concordância verbal.'
  },
  {
    text: 'Qual é a forma do verbo <em>"cantar"</em> no futuro para <em>"eles/elas"</em>?',
    opts: ['Cantaremos','Cantareis','Cantará','Cantarão'],
    correct: 3,
    expl: 'Para "eles/elas" (3ª pessoa do plural) no futuro, o verbo "cantar" se flexiona em "cantarão".'
  },
  {
    text: 'Ao reescrever a frase "Eu abro o livro" substituindo "eu" por <em>"ele/ela"</em>, qual é a forma correta do verbo?',
    opts: ['Abres','Abrem','Abrimos','Abre'],
    correct: 3,
    expl: 'Para "ele/ela" (3ª pessoa do singular) no presente, o verbo "abrir" se flexiona em "abre" — ele/ela abre o livro.'
  },
  {
    text: 'O verbo deve concordar com o pronome em:',
    opts: ['Gênero e grau','Letra e sílaba','Pessoa e número','Tempo e modo'],
    correct: 2,
    expl: 'A concordância verbal entre pronomes e verbos ocorre em pessoa (1ª, 2ª ou 3ª) e número (singular ou plural).'
  },
  {
    text: 'Exercício do livro: "A festa da Ana estava boa? Eu vi as fotos, e ______ parecia muito feliz." Qual pronome preenche corretamente a lacuna? (O pronome retoma "Ana")',
    opts: ['Eles','Nós','Tu','Ela'],
    correct: 3,
    expl: '"Ana" é singular feminino, então o pronome que retoma é "ela" (3ª pessoa singular). O verbo "parecer" concorda: ela parecia.'
  },
  {
    text: 'Quando um substantivo no <em>plural</em> é retomado por um pronome, o verbo deve concordar com:',
    opts: ['O substantivo original, sempre no singular','Apenas o tempo verbal da frase','O pronome que retoma, em pessoa e número','O gênero do substantivo'],
    correct: 2,
    expl: 'O verbo concorda com o pronome que retoma o substantivo. Se o substantivo está no plural, o pronome retoma no plural e o verbo fica no plural também.'
  }
];

var quizCurrent = 0;
var quizScore = 0;
var quizHits = 0;
var quizAnswered = false;
var quizLog = [];

function buildDots() {
  var d = document.getElementById('dots');
  d.innerHTML = '';
  QUESTIONS.forEach(function(_, i) {
    var el = document.createElement('div');
    el.className = 'dot' + (i === 0 ? ' current' : '');
    el.id = 'dot-' + i;
    d.appendChild(el);
  });
}

function updateDots() {
  QUESTIONS.forEach(function(_, i) {
    var el = document.getElementById('dot-' + i);
    if (i < quizCurrent) {
      el.className = 'dot ' + (quizLog[i] ? 'done-ok' : 'done-err');
    } else if (i === quizCurrent) {
      el.className = 'dot current';
    } else {
      el.className = 'dot';
    }
  });
}

function loadQuestion() {
  quizAnswered = false;
  var q = QUESTIONS[quizCurrent];
  document.getElementById('q-badge').textContent = 'QUESTÃO ' + (quizCurrent + 1);
  document.getElementById('q-text').innerHTML = q.text;
  document.getElementById('prog-label').textContent = 'Questão ' + (quizCurrent + 1) + ' de ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = ((quizCurrent / QUESTIONS.length) * 100) + '%';
  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var letters = ['A','B','C','D'];
  q.opts.forEach(function(txt, i) {
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="opt-letter">' + letters[i] + '</span>' + txt;
    btn.onclick = (function(idx){ return function(){ selectOpt(idx); }; })(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('feedback-box').innerHTML = '';
  document.getElementById('btn-next').className = 'btn-next';
  updateDots();
}

function selectOpt(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  var q = QUESTIONS[quizCurrent];
  var opts = document.querySelectorAll('.opt');
  opts.forEach(function(o){ o.disabled = true; });
  var fb = document.getElementById('feedback-box');
  if (idx === q.correct) {
    opts[idx].classList.add('correct');
    fb.className = 'feedback-box fb-ok show';
    fb.innerHTML = '<span class="fb-ico">✅</span><span>Muito bem! ' + q.expl + '</span>';
    quizScore += 10;
    quizHits++;
    quizLog.push(true);
    document.getElementById('sb-score').textContent = quizScore;
    document.getElementById('sb-hits').textContent = quizHits;
  } else {
    opts[idx].classList.add('wrong');
    opts[q.correct].classList.add('correct');
    fb.className = 'feedback-box fb-err show';
    fb.innerHTML = '<span class="fb-ico">❌</span><span>A resposta certa era <strong>' + ['A','B','C','D'][q.correct] + '</strong>. ' + q.expl + '</span>';
    quizLog.push(false);
  }
  if (quizCurrent < QUESTIONS.length - 1) {
    document.getElementById('btn-next').className = 'btn-next show';
  } else {
    setTimeout(showResults, 1500);
  }
}

function nextQuestion() {
  quizCurrent++;
  loadQuestion();
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  var res = document.getElementById('results');
  res.className = 'results show';
  var pct = Math.round((quizHits / QUESTIONS.length) * 100);
  window.sabendoScore = pct;
  document.getElementById('res-sub').textContent = 'Você acertou ' + quizHits + ' de ' + QUESTIONS.length + ' questões (' + pct + '%)';
  var emoji, title, medal;
  if (quizHits === QUESTIONS.length) { emoji='🏆'; title='Perfeito! Expert em concordância!'; medal='🥇 Medalha de Ouro'; }
  else if (quizHits >= 8) { emoji='🌟'; title='Incrível! Quase perfeito!'; medal='🥈 Medalha de Prata'; }
  else if (quizHits >= 6) { emoji='😊'; title='Muito bem! Bom trabalho!'; medal='🥉 Medalha de Bronze'; }
  else if (quizHits >= 4) { emoji='💪'; title='Continue praticando!'; medal='📚 Continue estudando!'; }
  else { emoji='🔄'; title='Revise o conteúdo e tente de novo!'; medal='📖 Hora de revisar!'; }
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('medal').textContent = medal;
  var rl = document.getElementById('review-list');
  rl.innerHTML = '<p style="font-size:12px;font-weight:800;margin-bottom:8px;color:var(--muted)">RESUMO DAS QUESTÕES:</p>';
  quizLog.forEach(function(ok, i) {
    var d = document.createElement('div');
    d.className = 'rev-item ' + (ok ? 'ok' : 'err');
    var txt = QUESTIONS[i].text.replace(/<[^>]+>/g,'');
    d.innerHTML = '<span class="rev-ico">' + (ok ? '✅' : '❌') + '</span><span><strong>Q' + (i+1) + '.</strong> ' + txt.substring(0, 70) + (txt.length > 70 ? '…' : '') + '</span>';
    rl.appendChild(d);
  });
}

function restartQuiz() {
  quizCurrent = 0; quizScore = 0; quizHits = 0; quizAnswered = false; quizLog = [];
  document.getElementById('sb-score').textContent = 0;
  document.getElementById('sb-hits').textContent = 0;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('results').className = 'results';
  buildDots();
  loadQuestion();
}

buildDots();
loadQuestion();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "port";
  var THEME_SLUG = "concordancia-pronomes-verbos";
  var ACTIVITY_TYPE = "quiz";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Concorda",
    characterEmoji: "🔗",
    characterImg:   "chars/concordancia-pronomes-verbos-hd.png",
    themeLabel:     "Concordância Pronomes e Verbos · Português",
    totalActivities: 4,
    primaryColor: "#7C3AED",
    lightColor: "#A78BFA",
    bgColor: "#F3F0FF",
    glowRgb: "124,58,237",
    backUrl: "../../index.html#theme-port-concordancia-pronomes-verbos",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#7C3AED,#A78BFA)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var scoreVal = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: scoreVal, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
