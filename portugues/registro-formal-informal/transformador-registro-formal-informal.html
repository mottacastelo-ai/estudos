<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformador de Registros — Formal e Informal</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --port: #7C3AED; --port-light: #A78BFA; --port-bg: #F3F0FF;
  --port-dark: #4C1D95; --border: #DDD6FE;
  --text: #1A1A2E; --muted: #6B7280; --card: #fff;
  --ok: #059669; --ok-bg: #ECFDF5; --ok-border: #6EE7B7;
}
body { font-family: "Baloo 2", cursive; background: var(--port-bg); color: var(--text); min-height: 100vh; padding: 24px 16px 80px; }
.wrap { max-width: 680px; margin: 0 auto; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--port); text-decoration: none; margin-bottom: 16px; }
.back-link:hover { opacity: .75; }
.activity-card { background: var(--card); border: 2px solid var(--border); border-radius: 24px; overflow: hidden; box-shadow: 0 4px 24px rgba(124,58,237,.12); }
.card-header { background: linear-gradient(135deg, var(--port-dark), var(--port) 60%, var(--port-light)); padding: 20px 24px 18px; display: flex; align-items: center; gap: 14px; }
.hicon { font-size: 32px; line-height: 1; }
.card-header h1 { font-family: "Space Mono", monospace; font-size: 16px; color: #fff; line-height: 1.3; }
.card-header p { font-size: 12px; color: rgba(255,255,255,.8); margin-top: 2px; font-weight: 600; }
.hbadge { margin-left: auto; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }

/* Progress */
.progress-area { padding: 16px 24px 0; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.prog-track { height: 8px; border-radius: 999px; background: var(--border); }
.prog-fill { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--port), var(--port-light)); transition: width .4s; }

/* Card counter */
.card-counter { text-align: center; padding: 10px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.card-counter strong { color: var(--port); }

/* Transform card */
.transform-card { margin: 16px 24px; background: var(--port-bg); border: 2px solid var(--border); border-radius: 18px; padding: 20px; }
.badge-dir { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px; }
.badge-dir.to-formal   { background: #EDE9FE; color: var(--port-dark); border: 1.5px solid var(--port-light); }
.badge-dir.to-informal { background: #FFF7ED; color: #92400E; border: 1.5px solid #FCD34D; }

.situacao-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.situacao-text { font-size: 13px; font-weight: 600; color: var(--text); background: rgba(255,255,255,.7); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; line-height: 1.5; }

.original-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.original-phrase { font-size: 15px; font-weight: 700; color: var(--text); background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-style: italic; line-height: 1.5; }

.target-label { font-size: 12px; font-weight: 700; color: var(--port-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.target-input { width: 100%; font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 600; color: var(--text); background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; resize: vertical; min-height: 70px; outline: none; transition: border-color .2s; }
.target-input:focus { border-color: var(--port); }

/* Suggestion */
.sugestao-wrap { margin-top: 14px; }
.btn-sugestao { background: transparent; border: 2px solid var(--port-light); color: var(--port); font-family: "Baloo 2", cursive; font-size: 13px; font-weight: 700; padding: 8px 20px; border-radius: 50px; cursor: pointer; transition: all .18s; }
.btn-sugestao:hover { background: var(--port-bg); }
.sugestao-box { display: none; background: var(--ok-bg); border: 2px solid var(--ok-border); border-radius: 12px; padding: 12px 16px; margin-top: 10px; }
.sugestao-box.show { display: block; animation: fadeIn .25s; }
.sugestao-title { font-size: 11px; font-weight: 800; color: var(--ok); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.sugestao-text { font-size: 14px; font-weight: 700; color: #065F46; line-height: 1.5; }
.sugestao-exp { font-size: 12px; color: #047857; margin-top: 6px; line-height: 1.5; }

/* Navigation */
.nav-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px 20px; gap: 12px; }
.btn-nav { font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 800; padding: 11px 24px; border-radius: 50px; border: none; cursor: pointer; transition: all .18s; }
.btn-prev { background: var(--border); color: var(--port-dark); }
.btn-prev:hover { background: #C4B5FD; }
.btn-next-card { background: linear-gradient(135deg, var(--port), var(--port-light)); color: #fff; box-shadow: 0 4px 14px rgba(124,58,237,.3); }
.btn-next-card:hover { transform: scale(1.04); }
.btn-next-card:disabled { opacity: .5; cursor: default; transform: none; }

/* Results */
.results-panel { display: none; padding: 32px 24px; text-align: center; }
.results-panel.show { display: block; }
.result-emoji { font-size: 52px; margin-bottom: 12px; }
.result-title { font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700; color: var(--port-dark); margin-bottom: 8px; }
.result-score { font-family: "Space Mono", monospace; font-size: 42px; font-weight: 700; color: var(--port); margin: 8px 0; }
.result-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.btn-restart { background: linear-gradient(135deg, var(--port), var(--port-light)); color: #fff; border: none; border-radius: 50px; padding: 14px 32px; font-family: "Baloo 2", cursive; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 16px rgba(124,58,237,.3); }
.btn-restart:hover { transform: scale(1.04); transition: transform .15s; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 480px) {
  body { padding: 16px 10px 80px; }
  .transform-card { margin: 12px 16px; }
  .nav-row { padding: 12px 16px 16px; }
  .original-phrase { font-size: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../index.html" onclick="voltarAoPortal(); return false;">← Voltar ao portal</a>
  <div class="activity-card">
    <div class="card-header">
      <div class="hicon">🔄</div>
      <div><h1>Transformador de Registros</h1><p>Registro Linguístico: Formal e Informal</p></div>
      <div class="hbadge">6 frases</div>
    </div>
    <div class="progress-area">
      <div class="progress-label">
        <span id="prog-label">Frase 1 de 6</span>
        <span id="prog-done">0 concluídas</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="card-counter">Reescreva a frase no registro indicado e compare com a sugestão.</div>

    <div id="main-area">
      <div class="transform-card" id="transform-card"></div>
      <div class="nav-row">
        <button class="btn-nav btn-prev" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
        <button class="btn-nav btn-next-card" id="btn-next-card" onclick="navigate(1)">Próxima →</button>
      </div>
    </div>

    <div class="results-panel" id="results-panel">
      <div class="result-emoji">🦎</div>
      <div class="result-title">Todas as frases transformadas!</div>
      <div class="result-score" id="result-score"></div>
      <div class="result-sub" id="result-sub"></div>
      <button class="btn-restart" onclick="restartTransformador()">Praticar novamente</button>
    </div>
  </div>
</div>

<script>
var transformItems = [
  {
    dir: 'to-formal',
    dirLabel: 'Informal → Formal',
    dirEmoji: '👔',
    situacao: 'Você encontra o pai de um amigo na rua e quer perguntar como ele está.',
    original: '"E aí, tudo bem com o senhor?"',
    sugestao: '"Como o senhor está? Tudo bem?"',
    explicacao: 'No registro formal, evitamos expressões espontâneas como "E aí" e usamos construções mais monitoradas e respeitosas, como "Como o senhor está?"'
  },
  {
    dir: 'to-formal',
    dirLabel: 'Informal → Formal',
    dirEmoji: '👔',
    situacao: 'Você precisa enviar uma mensagem ao professor pedindo para entregar o trabalho um dia depois.',
    original: '"Professor, posso mandar o trabalho amanhã? Acabei esquecendo!"',
    sugestao: '"Professor, venho solicitar um prazo adicional para a entrega do trabalho."',
    explicacao: 'No registro formal, usamos verbos como "solicitar" e "venho" no lugar de expressões espontâneas como "acabei esquecendo", adequados a uma situação de comunicação mais séria e monitorada.'
  },
  {
    dir: 'to-formal',
    dirLabel: 'Informal → Formal',
    dirEmoji: '👔',
    situacao: 'Você escreve uma carta para o diretor da escola pedindo uso da quadra no intervalo.',
    original: '"Cara, a gente queria usar a quadra todo intervalo, pode ser?"',
    sugestao: '"Prezado diretor, solicitamos autorização para utilizar a quadra durante os intervalos."',
    explicacao: 'O registro formal usa formas de tratamento como "Prezado" e verbos no infinitivo ("solicitar", "utilizar"), evitando "cara" e "a gente".'
  },
  {
    dir: 'to-informal',
    dirLabel: 'Formal → Informal',
    dirEmoji: '😊',
    situacao: 'Você quer contar para um amigo que vai chegar atrasado no jogo.',
    original: '"Informo que chegarei com atraso ao local combinado."',
    sugestao: '"Ei, vou chegar mais tarde no jogo, me espera!"',
    explicacao: 'No registro informal, com um amigo, a situação de comunicação permite um uso mais espontâneo: usamos "Ei", "vou chegar" e expressões do cotidiano.'
  },
  {
    dir: 'to-informal',
    dirLabel: 'Formal → Informal',
    dirEmoji: '😊',
    situacao: 'Você quer comentar com um colega que o filme do cinema ontem foi muito bom.',
    original: '"O filme exibido ontem no cinema foi de excelente qualidade cinematográfica."',
    sugestao: '"Cara, o filme de ontem foi incrível, você devia ter ido!"',
    explicacao: 'Com amigos, o registro informal é adequado: usamos "cara", "incrível" e construções mais espontâneas e naturais do cotidiano.'
  },
  {
    dir: 'to-formal',
    dirLabel: 'Informal → Formal',
    dirEmoji: '👔',
    situacao: 'Você escreve um parágrafo para um texto escolar sobre o campeonato de futebol.',
    original: '"O time que tem tênis e camisa ganha fácil, dá aquela goleada!"',
    sugestao: '"O time que dispõe de mais recursos materiais vence com maior facilidade."',
    explicacao: 'Em textos escolares, o registro formal é o mais adequado. A frase formal evita expressões espontâneas como "ganha fácil" e "dá aquela goleada", usando construções mais monitoradas.'
  }
];

var currentItemIndex = 0;
var completedItems = {};

function renderCard() {
  var item = transformItems[currentItemIndex];
  var card = document.getElementById('transform-card');
  var isDone = completedItems[currentItemIndex];

  card.innerHTML = `
    <div class="badge-dir ${item.dir}">
      <span>${item.dirEmoji}</span>
      <span>${item.dirLabel}</span>
    </div>
    <div class="situacao-label">Situação comunicativa</div>
    <div class="situacao-text">${item.situacao}</div>
    <div class="original-label">Frase original</div>
    <div class="original-phrase">${item.original}</div>
    <div class="target-label">Sua versão no registro ${item.dir === 'to-formal' ? 'formal' : 'informal'}</div>
    <textarea class="target-input" id="input-texto" placeholder="Escreva aqui a frase transformada..." oninput="onTextInput()">${(completedItems[currentItemIndex] && completedItems[currentItemIndex].texto) || ''}</textarea>
    <div class="sugestao-wrap">
      <button class="btn-sugestao" id="btn-ver-sugestao" onclick="verSugestao()">Ver sugestão</button>
      <div class="sugestao-box ${isDone ? 'show' : ''}" id="sugestao-box">
        <div class="sugestao-title">Sugestão do livro</div>
        <div class="sugestao-text">${item.sugestao}</div>
        <div class="sugestao-exp">${item.explicacao}</div>
      </div>
    </div>
  `;

  // Update progress
  document.getElementById('prog-label').textContent = 'Frase ' + (currentItemIndex + 1) + ' de ' + transformItems.length;
  var doneCount = Object.keys(completedItems).length;
  document.getElementById('prog-done').textContent = doneCount + ' concluída' + (doneCount !== 1 ? 's' : '');
  document.getElementById('prog-fill').style.width = (doneCount / transformItems.length * 100) + '%';

  // Nav buttons
  document.getElementById('btn-prev').style.visibility = currentItemIndex === 0 ? 'hidden' : 'visible';
  var isLast = currentItemIndex === transformItems.length - 1;
  var nextBtn = document.getElementById('btn-next-card');
  nextBtn.textContent = isLast ? 'Ver resultado →' : 'Próxima →';
}

function onTextInput() {
  var txt = document.getElementById('input-texto').value.trim();
  if (txt.length > 3) {
    if (!completedItems[currentItemIndex]) {
      completedItems[currentItemIndex] = { texto: txt };
      updateDoneCount();
    } else {
      completedItems[currentItemIndex].texto = txt;
    }
  }
}

function verSugestao() {
  var txt = document.getElementById('input-texto') ? document.getElementById('input-texto').value.trim() : '';
  completedItems[currentItemIndex] = { texto: txt, viu: true };
  updateDoneCount();
  document.getElementById('sugestao-box').classList.add('show');
  document.getElementById('btn-ver-sugestao').style.display = 'none';
}

function updateDoneCount() {
  var doneCount = Object.keys(completedItems).length;
  document.getElementById('prog-done').textContent = doneCount + ' concluída' + (doneCount !== 1 ? 's' : '');
  document.getElementById('prog-fill').style.width = (doneCount / transformItems.length * 100) + '%';
}

function navigate(dir) {
  // Save current text
  var inputEl = document.getElementById('input-texto');
  if (inputEl && inputEl.value.trim().length > 3) {
    if (!completedItems[currentItemIndex]) completedItems[currentItemIndex] = {};
    completedItems[currentItemIndex].texto = inputEl.value.trim();
    updateDoneCount();
  }

  var next = currentItemIndex + dir;
  if (next < 0) return;
  if (next >= transformItems.length) {
    showResults();
    return;
  }
  currentItemIndex = next;
  renderCard();
}

function showResults() {
  document.getElementById('main-area').style.display = 'none';
  var doneCount = Object.keys(completedItems).length;
  var pct = Math.round((doneCount / transformItems.length) * 100);
  window.sabendoScore = pct;
  document.getElementById('result-score').textContent = pct + '%';
  document.getElementById('result-sub').textContent = doneCount + ' de ' + transformItems.length + ' frases trabalhadas!';
  document.getElementById('results-panel').classList.add('show');
}

function restartTransformador() {
  currentItemIndex = 0;
  completedItems = {};
  document.getElementById('main-area').style.display = 'block';
  document.getElementById('results-panel').classList.remove('show');
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-done').textContent = '0 concluídas';
  renderCard();
}

renderCard();
</script>

<!-- concluir-btn -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "port";
  var THEME_SLUG = "registro-formal-informal";
  var ACTIVITY_TYPE = "transformador";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Camaleão Ling",
    characterEmoji: "🦎",
    characterImg:   "chars/registro-formal-informal-hd.png",
    themeLabel:     "Registro Linguístico · Português",
    totalActivities: 4,
    primaryColor: "#7C3AED",
    lightColor: "#A78BFA",
    bgColor: "#F3F0FF",
    glowRgb: "124,58,237",
    backUrl: "../../index.html#theme-port-registro-formal-informal",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#7C3AED,#A78BFA)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
<script src="../../shared/portal-back.js"></script>
</body>
