<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Acentuação das Oxítonas</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --port:#7C3AED;--port-light:#A78BFA;--port-bg:#F3F0FF;
  --port-dark:#4C1D95;--border:#DDD6FE;
  --card:#fff;--text:#1A1A2E;--muted:#6B7280;--radius:18px;
  --green:#059669;--red:#DC2626;--green-bg:#ECFDF5;--red-bg:#FEF2F2;
}
body{font-family:"Baloo 2",cursive;background:var(--port-bg);color:var(--text);min-height:100vh;padding:20px 16px 80px;}
.wrap{max-width:680px;margin:0 auto;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--port);text-decoration:none;margin-bottom:14px;cursor:pointer;background:none;border:none;padding:0;font-family:"Baloo 2",cursive;}
.back-link:hover{opacity:.7;}
.card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 24px rgba(124,58,237,.08);}
.card-header{background:linear-gradient(135deg,#2D1B69,#7C3AED 60%,#A78BFA);padding:20px 24px 18px;display:flex;align-items:center;gap:14px;}
.card-header .hicon{font-size:32px;line-height:1;}
.card-header h1{font-family:"Space Mono",monospace;font-size:16px;color:#fff;line-height:1.2;}
.card-header p{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:600;}
.hbadge{margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;white-space:nowrap;}
.prog-wrap{padding:14px 24px 0;}
.prog-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.prog-track{height:8px;border-radius:999px;background:var(--border);}
.prog-fill{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--port),var(--port-light));transition:width .4s;}
.score-row{display:flex;justify-content:space-between;padding:8px 24px 0;font-size:13px;font-weight:700;color:var(--muted);}
.score-row span{color:var(--port);}
.q-area{padding:20px 24px 16px;}
.q-num{font-size:11px;font-weight:800;color:var(--port-light);letter-spacing:.06em;margin-bottom:6px;}
.q-text{font-size:16px;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:16px;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--border);border-radius:12px;cursor:pointer;background:var(--card);font-size:14px;font-weight:600;color:var(--text);transition:all .15s;text-align:left;width:100%;font-family:"Baloo 2",cursive;}
.opt:hover{border-color:var(--port-light);background:var(--port-bg);}
.opt .opt-letter{width:28px;height:28px;border-radius:50%;background:var(--port-bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:"Space Mono",monospace;font-size:11px;font-weight:700;color:var(--port);flex-shrink:0;}
.opt.correct{border-color:var(--green);background:var(--green-bg);}
.opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:var(--red-bg);}
.opt.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.opt.disabled{pointer-events:none;opacity:.7;}
.opt.reveal-correct{border-color:var(--green);background:var(--green-bg);}
.opt.reveal-correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.feedback-box{margin:12px 0 0;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;line-height:1.5;display:none;}
.feedback-box.correct{background:var(--green-bg);border:2px solid #86efac;color:#065F46;}
.feedback-box.wrong{background:var(--red-bg);border:2px solid #fca5a5;color:#991B1B;}
.fb-icon{font-size:16px;margin-right:4px;}
.nav-row{display:flex;justify-content:flex-end;padding:0 24px 20px;}
.btn-next{font-family:"Baloo 2",cursive;font-size:14px;font-weight:800;padding:10px 28px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--port),var(--port-light));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3);transition:opacity .15s;display:none;}
.btn-next:hover{opacity:.85;}
.result-panel{display:none;padding:32px 24px;text-align:center;}
.result-emoji{font-size:56px;margin-bottom:12px;}
.result-title{font-family:"Space Mono",monospace;font-size:20px;font-weight:700;color:var(--port);margin-bottom:8px;}
.result-sub{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:20px;}
.result-bar-wrap{background:var(--border);border-radius:999px;height:12px;margin-bottom:8px;overflow:hidden;}
.result-bar{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--port),var(--port-light));transition:width .6s;}
.result-pct{font-size:32px;font-weight:900;color:var(--port);margin-bottom:4px;}
.result-msg{font-size:14px;font-weight:600;color:var(--muted);}
.btn-retry{font-family:"Baloo 2",cursive;font-size:14px;font-weight:800;padding:12px 32px;border-radius:999px;cursor:pointer;background:var(--port-bg);color:var(--port);border:2px solid var(--border);margin-top:20px;}
.btn-retry:hover{border-color:var(--port);}
@media(max-width:480px){
  .card-header h1{font-size:13px;}
  .q-text{font-size:14px;}
  .opt{font-size:13px;padding:10px 12px;}
}
</style>
</head>
<body>
<div class="wrap">
  <button class="back-link" onclick="voltarAoPortal()">← Voltar ao portal</button>
  <div class="card">
    <div class="card-header">
      <div class="hicon">´</div>
      <div><h1>Quiz — Acentuação das Oxítonas</h1><p>Português · 5º ano · Capítulo 7</p></div>
      <div class="hbadge">📖 10 questões</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label" id="prog-label">Questão 1 de 10</div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="score-row">
      <span id="score-txt">Acertos: <span id="acertos">0</span></span>
      <span id="erros-txt">Erros: <span id="erros">0</span></span>
    </div>
    <div class="q-area" id="q-area">
      <div class="q-num" id="q-num">QUESTÃO 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="opts-wrap"></div>
      <div class="feedback-box" id="feedback-box"></div>
    </div>
    <div class="nav-row">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Próxima →</button>
    </div>
    <div class="result-panel" id="result-panel">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-pct" id="result-pct"></div>
      <div class="result-bar-wrap"><div class="result-bar" id="result-bar" style="width:0%"></div></div>
      <div class="result-msg" id="result-msg"></div>
      <button class="btn-retry" onclick="restartQuiz()">↺ Tentar novamente</button>
    </div>
  </div>
</div>
<script>
var QUIZ = [
  {
    q: "Numa palavra <strong>oxítona</strong>, a sílaba tônica (a mais forte) está na:",
    opts: ["Primeira sílaba da palavra","Última sílaba da palavra","Penúltima sílaba da palavra","Sílaba do meio da palavra"],
    ans: 1,
    fb: "Correto! Nas palavras <strong>oxítonas</strong>, a sílaba tônica sempre está na <strong>última sílaba</strong>. Exemplos: va-ta-PÁ, ca-FÉ, ju-DÔ, ne-NÉM."
  },
  {
    q: "Qual das palavras a seguir é uma <strong>oxítona</strong> que recebe acento gráfico obrigatório?",
    opts: ["caderno","café","árvore","livro"],
    ans: 1,
    fb: "Correto! <strong>Café</strong> (ca-FÉ) é oxítona terminada em <strong>e</strong> — e oxítonas terminadas em e, a ou o sempre recebem acento. As demais são paroxítonas ou proparoxítonas."
  },
  {
    q: "Segundo o livro, palavras oxítonas terminadas em <strong>a</strong>, <strong>e</strong> ou <strong>o</strong> (seguidas ou não de s):",
    opts: ["Sempre recebem acento gráfico","Recebem acento apenas quando seguidas de 's'","Nunca recebem acento gráfico","Recebem acento gráfico só em nomes próprios"],
    ans: 0,
    fb: "Correto! Toda oxítona terminada em a, e ou o (com ou sem s no final) <strong>sempre recebe acento gráfico</strong>. Exemplos do livro: vatapá, filés, judô, robôs."
  },
  {
    q: "A palavra <strong>\"neném\"</strong> leva acento gráfico porque é oxítona terminada em:",
    opts: ["ditongo aberto","\"em\"","vogal 'e' simples","consoante nasal"],
    ans: 1,
    fb: "Correto! <strong>Neném</strong> (ne-NÉM) termina em <strong>em</strong> — oxítonas terminadas em 'em' ou 'ens' sempre recebem acento. Outros exemplos: além, também, armazéns, parabéns."
  },
  {
    q: "Qual das palavras leva acento gráfico por ser oxítona com <strong>ditongo aberto</strong>?",
    opts: ["herói","além","robô","crachá"],
    ans: 0,
    fb: "Correto! <strong>Herói</strong> tem ditongo aberto <strong>oi</strong> — oxítonas com ditongos abertos ei, eu ou oi (seguidos ou não de s) levam acento. 'Além' segue outra regra (em); 'robô' termina em o; 'crachá' termina em a."
  },
  {
    q: "A palavra <strong>\"português\"</strong> é oxítona e recebe acento gráfico. Em qual regra ela se enquadra?",
    opts: ["Oxítona com ditongo aberto","Oxítona terminada em 'e' seguida de 's'","Oxítona terminada em 'em'","Oxítona terminada em 'ens'"],
    ans: 1,
    fb: "Correto! <strong>Português</strong> = por-tu-GUÊS. Termina em <strong>e + s</strong>, seguindo a regra das oxítonas terminadas em e (seguidas ou não de s). Outros exemplos: filés, bebês, através."
  },
  {
    q: "Qual das palavras a seguir é oxítona mas <strong>NÃO</strong> leva acento gráfico?",
    opts: ["vatapá","judô","rapaz","neném"],
    ans: 2,
    fb: "Correto! <strong>Rapaz</strong> (ra-PAZ) é oxítona, mas termina em <strong>z</strong> — terminação que <strong>não está</strong> na lista das que exigem acento gráfico. Apenas a/e/o, em/ens e ditongos abertos exigem acento."
  },
  {
    q: "As palavras <strong>\"fogaréu\"</strong> e <strong>\"anzóis\"</strong> do livro compartilham que tipo de terminação?",
    opts: ["Terminação em 'a' ou 'o'","Terminação em 'em' ou 'ens'","Terminação em consoante","Ditongos abertos 'eu' e 'oi'"],
    ans: 3,
    fb: "Correto! <strong>Fogaréu</strong> tem ditongo aberto <strong>eu</strong> e <strong>anzóis</strong> tem ditongo aberto <strong>oi</strong>. São os ditongos abertos que exigem acento gráfico nas oxítonas."
  },
  {
    q: "O livro apresenta três grupos de oxítonas terminadas em <strong>o</strong>. Qual palavra pertence a esse grupo?",
    opts: ["café","robô","além","chapéus"],
    ans: 1,
    fb: "Correto! <strong>Robô</strong> é oxítona terminada em <strong>ô</strong>. O livro apresenta este grupo com: chororô, robô, jiló, dominó. Café termina em e; além termina em em; chapéus tem ditongo eu + s."
  },
  {
    q: "Qual das frases apresenta o acento <strong>correto</strong> em uma palavra oxítona?",
    opts: ["O herói salvou a cidade.","Ela pediu um cafe com leite.","Compramos maracuja na feira.","Ele praticava judo toda semana."],
    ans: 0,
    fb: "Correto! <strong>Herói</strong> leva acento por ser oxítona com ditongo aberto 'oi'. As demais frases têm palavras oxítonas sem o acento obrigatório: café (e), maracujá (a), judô (o)."
  }
];

var quizCurrent = 0;
var quizAcertos = 0;
var quizErros = 0;
var quizAnswered = false;
var LETTERS = ['A','B','C','D'];

function renderQuestion() {
  var qd = QUIZ[quizCurrent];
  document.getElementById('q-num').textContent = 'QUESTÃO ' + (quizCurrent + 1);
  document.getElementById('q-text').innerHTML = qd.q;
  document.getElementById('prog-label').textContent = 'Questão ' + (quizCurrent+1) + ' de ' + QUIZ.length;
  document.getElementById('prog-fill').style.width = (quizCurrent / QUIZ.length * 100) + '%';

  var wrap = document.getElementById('opts-wrap');
  wrap.innerHTML = '';
  qd.opts.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span>' + opt;
    btn.addEventListener('click', function() { checkAnswer(i); });
    wrap.appendChild(btn);
  });

  var fb = document.getElementById('feedback-box');
  fb.style.display = 'none';
  fb.className = 'feedback-box';
  document.getElementById('btn-next').style.display = 'none';
  quizAnswered = false;
}

function checkAnswer(idx) {
  if (quizAnswered) return;
  quizAnswered = true;

  var qd = QUIZ[quizCurrent];
  var opts = document.querySelectorAll('.opt');
  opts.forEach(function(o) { o.classList.add('disabled'); });

  var fb = document.getElementById('feedback-box');
  if (idx === qd.ans) {
    quizAcertos++;
    opts[idx].classList.add('correct');
    fb.className = 'feedback-box correct';
    fb.innerHTML = '<span class="fb-icon">✓</span>' + qd.fb;
    document.getElementById('acertos').textContent = quizAcertos;
  } else {
    quizErros++;
    opts[idx].classList.add('wrong');
    opts[qd.ans].classList.add('reveal-correct');
    var wrongMsg = 'Não foi dessa vez! ';
    fb.className = 'feedback-box wrong';
    fb.innerHTML = '<span class="fb-icon">✗</span>' + wrongMsg + qd.fb;
    document.getElementById('erros').textContent = quizErros;
  }
  fb.style.display = 'block';

  var isLast = quizCurrent === QUIZ.length - 1;
  var nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? 'Ver resultado' : 'Próxima →';
  nextBtn.style.display = 'block';
}

function nextQuestion() {
  quizCurrent++;
  if (quizCurrent >= QUIZ.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('q-area').style.display = 'none';
  document.getElementById('nav-row') && (document.querySelector('.nav-row').style.display = 'none');
  var pct = Math.round((quizAcertos / QUIZ.length) * 100);
  window.sabendoScore = pct;

  var panel = document.getElementById('result-panel');
  panel.style.display = 'block';

  var emoji, title, msg;
  if (pct >= 90) { emoji = '🏆'; title = 'Excelente!'; msg = 'Você domina as regras das oxítonas!'; }
  else if (pct >= 70) { emoji = '⭐'; title = 'Muito bom!'; msg = 'Continue praticando para fixar as regras!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Bom esforço!'; msg = 'Revise as terminações e tente novamente!'; }
  else { emoji = '💪'; title = 'Continue tentando!'; msg = 'Revise as regras das oxítonas e tente de novo!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = quizAcertos + ' de ' + QUIZ.length + ' questões corretas';
  document.getElementById('result-pct').textContent = pct + '%';
  document.getElementById('result-msg').textContent = msg;
  setTimeout(function() {
    document.getElementById('result-bar').style.width = pct + '%';
  }, 100);
}

function restartQuiz() {
  quizCurrent = 0;
  quizAcertos = 0;
  quizErros = 0;
  quizAnswered = false;
  document.getElementById('acertos').textContent = '0';
  document.getElementById('erros').textContent = '0';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('q-area').style.display = 'block';
  document.querySelector('.nav-row').style.display = 'flex';
  renderQuestion();
}

renderQuestion();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "port";
  var THEME_SLUG = "acentuacao-oxitonas";
  var ACTIVITY_TYPE = "quiz";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Oxin",
    characterEmoji: "´",
    characterImg:   "chars/acentuacao-oxitonas-hd.png",
    themeLabel:     "Acentuação das Oxítonas · Português",
    totalActivities: 4,
    primaryColor: "#7C3AED",
    lightColor: "#A78BFA",
    bgColor: "#F3F0FF",
    glowRgb: "124,58,237",
    backUrl: "../../index.html#theme-port-acentuacao-oxitonas",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#7C3AED,#A78BFA)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
<script src="../../shared/portal-back.js"></script>
</body>
