<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete a Lacuna — Acentuação das Oxítonas</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --port:#7C3AED;--port-light:#A78BFA;--port-bg:#F3F0FF;
  --port-dark:#4C1D95;--border:#DDD6FE;
  --card:#fff;--text:#1A1A2E;--muted:#6B7280;
  --green:#059669;--red:#DC2626;--green-bg:#ECFDF5;--red-bg:#FEF2F2;
}
body{font-family:"Baloo 2",cursive;background:var(--port-bg);color:var(--text);min-height:100vh;padding:20px 16px 80px;}
.wrap{max-width:680px;margin:0 auto;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--port);cursor:pointer;background:none;border:none;padding:0;margin-bottom:14px;font-family:"Baloo 2",cursive;}
.back-link:hover{opacity:.7;}
.card{background:var(--card);border:2px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 4px 24px rgba(124,58,237,.08);}
.card-header{background:linear-gradient(135deg,#2D1B69,#7C3AED 60%,#A78BFA);padding:20px 24px 18px;display:flex;align-items:center;gap:14px;}
.card-header .hicon{font-size:32px;line-height:1;}
.card-header h1{font-family:"Space Mono",monospace;font-size:16px;color:#fff;line-height:1.2;}
.card-header p{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:600;}
.hbadge{margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;white-space:nowrap;}
.prog-wrap{padding:14px 24px 4px;}
.prog-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.prog-track{height:8px;border-radius:999px;background:var(--border);}
.prog-fill{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--port),var(--port-light));transition:width .4s;}
.instrucao{padding:10px 24px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border);}
.instrucao strong{color:var(--text);}
.questions-wrap{padding:16px 24px 0;}
.item{margin-bottom:20px;padding:16px;border:2px solid var(--border);border-radius:16px;background:var(--card);transition:border-color .2s;}
.item.answered-correct{border-color:var(--green);background:var(--green-bg);}
.item.answered-wrong{border-color:var(--red);background:var(--red-bg);}
.item-num{font-size:11px;font-weight:800;color:var(--port-light);letter-spacing:.06em;margin-bottom:6px;}
.item-sentence{font-size:15px;font-weight:600;color:var(--text);line-height:1.6;margin-bottom:12px;}
.item-sentence .blank{font-family:"Space Mono",monospace;font-size:14px;color:var(--port);font-weight:700;padding:2px 4px;border-bottom:2px solid var(--port);display:inline-block;min-width:80px;text-align:center;}
.opts-row{display:flex;gap:10px;flex-wrap:wrap;}
.opt-word{padding:8px 18px;border-radius:999px;border:2px solid var(--border);cursor:pointer;font-size:14px;font-weight:700;background:var(--card);color:var(--text);font-family:"Space Mono",monospace;transition:all .15s;}
.opt-word:hover{border-color:var(--port-light);background:var(--port-bg);color:var(--port);}
.opt-word.correct{border-color:var(--green);background:var(--green-bg);color:#065F46;pointer-events:none;}
.opt-word.wrong{border-color:var(--red);background:var(--red-bg);color:#991B1B;pointer-events:none;}
.opt-word.disabled{pointer-events:none;opacity:.5;}
.opt-word.reveal{border-color:var(--green);background:var(--green-bg);color:#065F46;pointer-events:none;}
.fb-item{font-size:12px;font-weight:600;margin-top:8px;display:none;line-height:1.5;}
.fb-item.correct{color:#065F46;}
.fb-item.wrong{color:#991B1B;}
.score-row{display:flex;justify-content:space-between;padding:12px 24px;font-size:13px;font-weight:700;color:var(--muted);border-top:2px solid var(--border);}
.score-row span{color:var(--port);}
.btn-check-wrap{padding:0 24px 20px;display:flex;justify-content:center;}
.btn-check{font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;padding:13px 40px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--port),var(--port-light));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3);transition:opacity .15s;display:none;}
.btn-check:hover{opacity:.85;}
.result-panel{display:none;padding:28px 24px;text-align:center;}
.result-emoji{font-size:48px;margin-bottom:10px;}
.result-title{font-family:"Space Mono",monospace;font-size:18px;font-weight:700;color:var(--port);margin-bottom:6px;}
.result-sub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:16px;}
.result-pct{font-size:30px;font-weight:900;color:var(--port);margin-bottom:4px;}
.result-bar-wrap{background:var(--border);border-radius:999px;height:10px;margin-bottom:16px;overflow:hidden;}
.result-bar{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--port),var(--port-light));transition:width .6s;}
.btn-retry{font-family:"Baloo 2",cursive;font-size:14px;font-weight:800;padding:12px 30px;border-radius:999px;cursor:pointer;background:var(--port-bg);color:var(--port);border:2px solid var(--border);}
.btn-retry:hover{border-color:var(--port);}
@media(max-width:480px){
  .item-sentence{font-size:14px;}
  .opt-word{padding:7px 14px;font-size:13px;}
}
</style>
</head>
<body>
<div class="wrap">
  <button class="back-link" onclick="voltarAoPortal()">← Voltar ao portal</button>
  <div class="card">
    <div class="card-header">
      <div class="hicon">✏️</div>
      <div><h1>Complete a Lacuna — Oxítonas</h1><p>Português · 5º ano · Capítulo 7</p></div>
      <div class="hbadge">⚡ Praticar</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label">8 frases para completar</div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="instrucao">
      <strong>Como fazer:</strong> Clique na palavra correta para preencher cada lacuna. Escolha a forma certa da oxítona — com ou sem acento gráfico.
    </div>
    <div class="questions-wrap" id="questions-wrap"></div>
    <div class="score-row" id="score-row" style="display:none;">
      <span>Acertos: <span id="clAcertos">0</span></span>
      <span>Erros: <span id="clErros">0</span></span>
    </div>
    <div class="btn-check-wrap">
      <button class="btn-check" id="btn-ver-resultado" onclick="verResultado()">Ver resultado</button>
    </div>
    <div class="result-panel" id="result-panel">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-pct" id="result-pct"></div>
      <div class="result-bar-wrap"><div class="result-bar" id="result-bar" style="width:0%"></div></div>
      <button class="btn-retry" onclick="restartActivity()">↺ Tentar novamente</button>
    </div>
  </div>
</div>
<script>
var ITENS = [
  {
    sentence: "No festejo, o prato principal era ___ , um prato típico da culinária baiana.",
    opts: ["vatapá", "vatapa"],
    ans: 0,
    fb: "Correto! vatapá → oxítona terminada em A → recebe acento obrigatório."
  },
  {
    sentence: "O açougue vendia ___ de frango já temperados para o churrasco.",
    opts: ["files", "filés"],
    ans: 1,
    fb: "Correto! filés → oxítona terminada em E + S → recebe acento obrigatório."
  },
  {
    sentence: "A lutadora campeã praticava ___ desde os seis anos de idade.",
    opts: ["judo", "judô"],
    ans: 1,
    fb: "Correto! judô → oxítona terminada em O → recebe acento obrigatório."
  },
  {
    sentence: "O ___ da vizinha sorriu e fez graça para todo mundo na roda de amigos.",
    opts: ["neném", "nene"],
    ans: 0,
    fb: "Correto! neném → oxítona terminada em EM → recebe acento obrigatório."
  },
  {
    sentence: "Os grãos ficam guardados nos ___ do porto até o momento do embarque.",
    opts: ["armazens", "armazéns"],
    ans: 1,
    fb: "Correto! armazéns → oxítona terminada em ENS → recebe acento obrigatório."
  },
  {
    sentence: "As flores foram embaladas em ___ de seda colorida para o presente.",
    opts: ["papéis", "papeis"],
    ans: 0,
    fb: "Correto! papéis → oxítona com ditongo aberto EI + S → recebe acento obrigatório."
  },
  {
    sentence: "O pescador guardou os ___ e as linhas na caixa de pesca antes de ir para o barco.",
    opts: ["anzois", "anzóis"],
    ans: 1,
    fb: "Correto! anzóis → oxítona com ditongo aberto OI + S → recebe acento obrigatório."
  },
  {
    sentence: "O ___ da história enfrentou muitas dificuldades antes de conseguir salvar a cidade.",
    opts: ["herói", "heroi"],
    ans: 0,
    fb: "Correto! herói → oxítona com ditongo aberto OI → recebe acento obrigatório."
  }
];

var clRespostas = [];
var clRespondidos = 0;
var clAcertos = 0;
var clErros = 0;

function buildQuestions() {
  var wrap = document.getElementById('questions-wrap');
  wrap.innerHTML = '';
  clRespostas = new Array(ITENS.length).fill(null);
  clRespondidos = 0;
  clAcertos = 0;
  clErros = 0;

  ITENS.forEach(function(item, idx) {
    var div = document.createElement('div');
    div.className = 'item';
    div.id = 'item-' + idx;

    var numDiv = document.createElement('div');
    numDiv.className = 'item-num';
    numDiv.textContent = 'FRASE ' + (idx + 1);
    div.appendChild(numDiv);

    var sentDiv = document.createElement('div');
    sentDiv.className = 'item-sentence';
    var parts = item.sentence.split('___');
    sentDiv.appendChild(document.createTextNode(parts[0]));
    var blank = document.createElement('span');
    blank.className = 'blank';
    blank.id = 'blank-' + idx;
    blank.textContent = '___';
    sentDiv.appendChild(blank);
    if (parts[1]) sentDiv.appendChild(document.createTextNode(parts[1]));
    div.appendChild(sentDiv);

    var optsRow = document.createElement('div');
    optsRow.className = 'opts-row';
    item.opts.forEach(function(opt, oi) {
      var btn = document.createElement('button');
      btn.className = 'opt-word';
      btn.textContent = opt;
      btn.addEventListener('click', function() { escolher(idx, oi); });
      optsRow.appendChild(btn);
    });
    div.appendChild(optsRow);

    var fb = document.createElement('div');
    fb.className = 'fb-item';
    fb.id = 'fb-' + idx;
    div.appendChild(fb);

    wrap.appendChild(div);
  });
}

function escolher(idx, optIdx) {
  if (clRespostas[idx] !== null) return;

  var item = ITENS[idx];
  var acertou = (optIdx === item.ans);
  clRespostas[idx] = optIdx;
  clRespondidos++;

  var div = document.getElementById('item-' + idx);
  div.classList.add(acertou ? 'answered-correct' : 'answered-wrong');

  var btns = div.querySelectorAll('.opt-word');
  btns.forEach(function(btn, i) {
    btn.classList.add('disabled');
    if (i === optIdx) {
      btn.classList.add(acertou ? 'correct' : 'wrong');
    }
    if (!acertou && i === item.ans) {
      btn.classList.add('reveal');
    }
  });

  var blank = document.getElementById('blank-' + idx);
  blank.textContent = item.opts[item.ans];
  blank.style.color = acertou ? 'var(--green)' : 'var(--red)';
  blank.style.borderBottomColor = acertou ? 'var(--green)' : 'var(--red)';

  if (acertou) { clAcertos++; } else { clErros++; }
  document.getElementById('clAcertos').textContent = clAcertos;
  document.getElementById('clErros').textContent = clErros;

  var fb = document.getElementById('fb-' + idx);
  fb.textContent = (acertou ? '✓ ' : '✗ ') + item.fb;
  fb.className = 'fb-item ' + (acertou ? 'correct' : 'wrong');
  fb.style.display = 'block';

  var pct = Math.round((clRespondidos / ITENS.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';

  document.getElementById('score-row').style.display = 'flex';

  if (clRespondidos === ITENS.length) {
    document.getElementById('btn-ver-resultado').style.display = 'block';
  }
}

function verResultado() {
  var pct = Math.round((clAcertos / ITENS.length) * 100);
  window.sabendoScore = pct;

  document.getElementById('btn-ver-resultado').style.display = 'none';
  var panel = document.getElementById('result-panel');
  panel.style.display = 'block';

  var emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Parabéns! Você dominou a acentuação!'; }
  else if (pct >= 70) { emoji = '⭐'; title = 'Muito bem! Quase perfeito!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Bom esforço! Revise as regras.'; }
  else { emoji = '💪'; title = 'Continue praticando!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = clAcertos + ' de ' + ITENS.length + ' frases corretas';
  document.getElementById('result-pct').textContent = pct + '%';
  setTimeout(function() { document.getElementById('result-bar').style.width = pct + '%'; }, 100);

  panel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function restartActivity() {
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('score-row').style.display = 'none';
  document.getElementById('clAcertos').textContent = '0';
  document.getElementById('clErros').textContent = '0';
  document.getElementById('prog-fill').style.width = '0%';
  buildQuestions();
}

buildQuestions();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "port";
  var THEME_SLUG = "acentuacao-oxitonas";
  var ACTIVITY_TYPE = "complete-lacuna";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Oxin",
    characterEmoji: "´",
    characterImg:   "chars/acentuacao-oxitonas-hd.png",
    themeLabel:     "Acentuação das Oxítonas · Português",
    totalActivities: 4,
    primaryColor: "#7C3AED",
    lightColor: "#A78BFA",
    bgColor: "#F3F0FF",
    glowRgb: "124,58,237",
    backUrl: "../../index.html#theme-port-acentuacao-oxitonas",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#7C3AED,#A78BFA)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
