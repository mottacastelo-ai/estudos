<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — Prepo Reveal (CSS filter + SVG clip)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1e1b4b;
  font-family: "Baloo 2", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  gap: 24px; padding: 32px 16px; min-height: 100vh;
}
h1 { color: white; font-size: 13px; opacity: .55; text-transform: uppercase; letter-spacing: .1em; }

/* ── Modal ── */
.modal {
  background: #fff; border-radius: 20px; padding: 20px 18px 16px;
  width: 300px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.modal-title { font-size: 17px; font-weight: 800; color: #1e1b4b; margin-bottom: 2px; }
.modal-sub   { font-size: 12px; color: #6b7280; margin-bottom: 14px; }

/* ── Character stage ── */
.char-stage {
  position: relative; width: 200px; height: 240px;
  margin: 0 auto 14px;
}
.char-stage img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain; display: block;
}
/* Shadow: same image darkened via CSS filter + SVG clip cuts holes as pieces reveal */
.char-shadow {
  filter: brightness(0.08) saturate(0);
  clip-path: url(#shadow-clip);
  transition: filter .6s ease;
}
/* When complete, fade shadow out entirely */
.char-shadow.complete {
  filter: brightness(0) saturate(0) opacity(0);
}

/* Flash overlay for each revealed piece */
.piece-flash {
  position: absolute; pointer-events: none; border-radius: 6px;
  background: rgba(167, 139, 250, 0.65);
  animation: piece-flash-anim 0.8s ease forwards;
}
@keyframes piece-flash-anim {
  0%   { opacity: 1; transform: scale(1.08); }
  60%  { opacity: .9; transform: scale(1); }
  100% { opacity: 0; }
}

/* Complete glow ring */
.char-stage.done::after {
  content: '';
  position: absolute; inset: -6px;
  border-radius: 20px;
  background: transparent;
  box-shadow: 0 0 0 4px #7C3AED, 0 0 40px rgba(124,58,237,.6);
  animation: ring-pulse 1.5s ease infinite;
}
@keyframes ring-pulse {
  0%,100% { box-shadow: 0 0 0 3px #7C3AED, 0 0 24px rgba(124,58,237,.4); }
  50%      { box-shadow: 0 0 0 5px #A78BFA, 0 0 48px rgba(167,139,250,.7); }
}

/* ── Piece chips (new pieces strip) ── */
.pieces-strip { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 28px; margin-bottom: 10px; }
.piece-chip {
  background: #EDE9FE; border: 1.5px solid #7C3AED;
  border-radius: 8px; padding: 3px 8px;
  font-size: 11px; font-weight: 800; color: #5B21B6;
  animation: chip-in .35s cubic-bezier(.22,1,.36,1) both;
}
.piece-chip:nth-child(2) { animation-delay: .07s; }
.piece-chip:nth-child(3) { animation-delay: .14s; }
.piece-chip:nth-child(4) { animation-delay: .21s; }
@keyframes chip-in {
  from { transform: scale(0) translateY(6px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* ── Progress ── */
.bar-wrap { background: #e5e7eb; border-radius: 99px; height: 8px; margin-bottom: 4px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#7C3AED,#A78BFA); transition: width .5s cubic-bezier(.22,1,.36,1); }
.bar-label { font-size: 11px; color: #9ca3af; margin-bottom: 12px; }

/* ── Carta desbloqueada ── */
.carta {
  display: none; background: #EDE9FE; border-radius: 14px;
  padding: 10px 14px; margin-bottom: 12px;
  animation: chip-in .5s cubic-bezier(.22,1,.36,1) both;
}
.carta.show { display: block; }
.carta-title { font-size: 13px; font-weight: 800; color: #1e1b4b; margin-bottom: 4px; }
.carta-char  { font-size: 13px; font-weight: 800; color: #5B21B6; }
.carta-badge { display: inline-block; background: #7C3AED; color: #fff; padding: 2px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; margin-top: 4px; }

/* ── Button ── */
.btn {
  background: linear-gradient(135deg,#7C3AED,#A78BFA);
  color: #fff; border: none; border-radius: 50px;
  padding: 10px; font-size: 13px; font-weight: 800;
  cursor: pointer; width: 100%; font-family: inherit;
  transition: opacity .2s;
}
.btn:disabled { opacity: .45; cursor: default; }

/* ── Controls ── */
.controls { display: flex; gap: 8px; }
.ctrl-btn {
  background: rgba(255,255,255,.12); color: white; border: 1.5px solid rgba(255,255,255,.2);
  border-radius: 10px; padding: 8px 16px; font-size: 12px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: .15s;
}
.ctrl-btn:hover { background: rgba(255,255,255,.22); }

/* Hidden SVG for clip definitions */
.clip-svg { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>

<h1>Mockup — Prepo sendo montado · CSS filter + SVG clipPath</h1>

<!-- SVG clip definitions (hidden, positioned in the page flow so coordinates match) -->
<svg class="clip-svg" aria-hidden="true">
  <defs>
    <clipPath id="shadow-clip" clipPathUnits="userSpaceOnUse">
      <!-- Starts as full rectangle covering 200×240. JS adds "hole" subpaths as pieces reveal.
           fill-rule evenodd: subpaths = holes → shadow disappears from revealed regions. -->
      <path id="cp" fill-rule="evenodd" d="M0,0 H200 V240 H0 Z"/>
    </clipPath>
  </defs>
</svg>

<div class="modal" id="modal">
  <div class="modal-title" id="modal-title">🔒 Prepo aguarda montagem</div>
  <div class="modal-sub" id="modal-sub">Preposições · 0 de 4 atividades</div>

  <!-- Character stage: color below, shadow on top (clipped away progressively) -->
  <div class="char-stage" id="char-stage">
    <img src="_landing/prepo-hd.png" class="char-color" alt="Prepo" draggable="false">
    <img src="_landing/prepo-hd.png" class="char-shadow" id="char-shadow" alt="" draggable="false">
  </div>

  <!-- New pieces this round -->
  <div class="pieces-strip" id="pieces-strip"></div>

  <!-- Carta (shown only on complete) -->
  <div class="carta" id="carta">
    <div class="carta-title">🃏 Carta desbloqueada!</div>
    <div class="carta-char">Prepo — O Robô das Preposições</div>
    <div class="carta-badge">🟣 Épica</div>
  </div>

  <!-- Progress -->
  <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  <div class="bar-label" id="bar-label">0 / 16 peças</div>

  <button class="btn" id="btn" onclick="doActivity()">▶ Fazer atividade 1 de 4</button>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="resetAll()">↺ Reiniciar</button>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
var W = 200, H = 240;
var PIECES_PER = 4, MAX_ACT = 4, TOTAL = 16;

// Normalized coords (pixels in 200×240 space)
var REGIONS = {
  p1:  { name:"Antena D",    x1:40,  y1:0,   x2:76,  y2:32  },
  p2:  { name:"Antena E",    x1:120, y1:0,   x2:158, y2:32  },
  p3:  { name:"Conector E",  x1:20,  y1:24,  x2:58,  y2:58  },
  p4:  { name:"Conector D",  x1:142, y1:24,  x2:180, y2:58  },
  p5:  { name:"Topo cabeça", x1:44,  y1:24,  x2:156, y2:60  },
  p6:  { name:"Face",        x1:44,  y1:54,  x2:156, y2:98  },
  p7:  { name:"Olho E",      x1:52,  y1:58,  x2:84,  y2:88  },
  p8:  { name:"Olho D",      x1:116, y1:58,  x2:148, y2:88  },
  p9:  { name:"Boca",        x1:66,  y1:84,  x2:134, y2:108 },
  p10: { name:"Ombros",      x1:50,  y1:103, x2:150, y2:132 },
  p11: { name:"Corpo",       x1:42,  y1:127, x2:158, y2:163 },
  p12: { name:"Placa PREPO", x1:54,  y1:157, x2:146, y2:187 },
  p13: { name:"Braço E",     x1:2,   y1:110, x2:46,  y2:164 },
  p14: { name:"Braço D",     x1:154, y1:110, x2:198, y2:164 },
  p15: { name:"Perna E",     x1:50,  y1:182, x2:92,  y2:237 },
  p16: { name:"Perna D",     x1:108, y1:182, x2:150, y2:237 }
};

// ── State ────────────────────────────────────────────────────────────────────
var collected = [];   // ids already revealed
var activity  = 0;
var busy      = false;

// ── Clip path management ─────────────────────────────────────────────────────
function buildPath(revealedIds) {
  // Outer rect covers whole stage
  var d = "M0,0 H" + W + " V" + H + " H0 Z";
  // Each revealed piece adds a rectangular hole (evenodd → hole)
  revealedIds.forEach(function(id) {
    var r = REGIONS[id];
    d += " M" + r.x1 + "," + r.y1 +
         " H" + r.x2 +
         " V" + r.y2 +
         " H" + r.x1 + " Z";
  });
  return d;
}

function applyClip(revealedIds) {
  document.getElementById('cp').setAttribute('d', buildPath(revealedIds));
}

// ── Flash overlay ────────────────────────────────────────────────────────────
function flashPiece(id) {
  var r = REGIONS[id];
  var el = document.createElement('div');
  el.className = 'piece-flash';
  el.style.left   = r.x1 + 'px';
  el.style.top    = r.y1 + 'px';
  el.style.width  = (r.x2 - r.x1) + 'px';
  el.style.height = (r.y2 - r.y1) + 'px';
  document.getElementById('char-stage').appendChild(el);
  setTimeout(function() { el.remove(); }, 900);
}

// ── Shuffle ──────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── Main action ──────────────────────────────────────────────────────────────
function doActivity() {
  if (busy || activity >= MAX_ACT) return;
  busy = true;
  activity++;

  // Pick 4 random uncollected
  var available = Object.keys(REGIONS).filter(function(id) {
    return collected.indexOf(id) === -1;
  });
  var picks = shuffle(available).slice(0, PIECES_PER);

  // Stagger each reveal
  picks.forEach(function(id, i) {
    setTimeout(function() {
      collected.push(id);
      applyClip(collected);    // update shadow hole
      flashPiece(id);          // flash glow
      if (i === picks.length - 1) afterAllRevealed(picks);
    }, i * 160);
  });
}

function afterAllRevealed(picks) {
  // Update subtitle
  document.getElementById('modal-sub').textContent =
    'Preposições · ' + activity + ' de ' + MAX_ACT + ' atividades';

  // Update chips
  var strip = document.getElementById('pieces-strip');
  strip.innerHTML = '';
  picks.forEach(function(id) {
    var chip = document.createElement('span');
    chip.className = 'piece-chip';
    chip.textContent = REGIONS[id].name;
    strip.appendChild(chip);
  });

  // Progress bar
  var pct = Math.round((collected.length / TOTAL) * 100);
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('bar-label').textContent =
    collected.length + ' / ' + TOTAL + ' peças';

  if (collected.length >= TOTAL) {
    finishComplete();
  } else {
    document.getElementById('modal-title').textContent = '✨ ' + picks.length + ' peças reveladas!';
    var btn = document.getElementById('btn');
    btn.textContent = '▶ Fazer atividade ' + (activity + 1) + ' de ' + MAX_ACT;
    busy = false;
  }
}

function finishComplete() {
  // Fade out shadow entirely
  document.getElementById('char-shadow').classList.add('complete');
  document.getElementById('char-stage').classList.add('done');

  document.getElementById('modal-title').textContent = '🎉 Prepo Montado!';
  document.getElementById('modal-sub').textContent = 'Você completou todas as atividades!';
  document.getElementById('pieces-strip').innerHTML = '';

  setTimeout(function() {
    document.getElementById('carta').classList.add('show');
    var btn = document.getElementById('btn');
    btn.textContent = '→ Ver minha coleção';
    btn.disabled = false;
    busy = false;
  }, 700);
}

// ── Reset ────────────────────────────────────────────────────────────────────
function resetAll() {
  collected = []; activity = 0; busy = false;
  applyClip([]);
  document.getElementById('char-shadow').classList.remove('complete');
  document.getElementById('char-stage').classList.remove('done');
  document.getElementById('modal-title').textContent = '🔒 Prepo aguarda montagem';
  document.getElementById('modal-sub').textContent = 'Preposições · 0 de ' + MAX_ACT + ' atividades';
  document.getElementById('pieces-strip').innerHTML = '';
  document.getElementById('carta').classList.remove('show');
  document.getElementById('bar').style.width = '0%';
  document.getElementById('bar-label').textContent = '0 / ' + TOTAL + ' peças';
  var btn = document.getElementById('btn');
  btn.textContent = '▶ Fazer atividade 1 de ' + MAX_ACT;
  btn.disabled = false;
}
</script>
</body>
</html>
