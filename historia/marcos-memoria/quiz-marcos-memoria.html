<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Marcos de Memória</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #B45309; --light: #F59E0B; --bg: #FFFBEB; --dark: #78350F; --correct: #059669; --wrong: #DC2626; --neutral: #374151; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Baloo 2', sans-serif; background: var(--bg); min-height: 100vh; color: var(--neutral); }
.hero { background: linear-gradient(135deg, #78350F, #B45309 60%, #F59E0B); padding: 2rem 1.5rem 1.5rem; text-align: center; color: white; }
.hero-emoji { font-size: 3rem; margin-bottom: .4rem; }
.hero h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.2; }
.hero p { font-size: .95rem; opacity: .9; margin-top: .4rem; }
.container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.progress-bar-wrap { background: #e5e7eb; border-radius: 99px; height: 10px; margin: 1.2rem 0; }
.progress-bar { background: linear-gradient(90deg, var(--primary), var(--light)); height: 10px; border-radius: 99px; transition: width .4s; }
.q-label { font-family: 'Space Mono', monospace; font-size: .8rem; color: var(--primary); font-weight: 700; margin-bottom: .3rem; }
.q-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.2rem; line-height: 1.4; }
.options { display: flex; flex-direction: column; gap: .7rem; margin-bottom: 1rem; }
.opt-btn { background: white; border: 2.5px solid #e5e7eb; border-radius: 12px; padding: .85rem 1.1rem; font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left; transition: all .2s; color: var(--neutral); }
.opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #fff7ed; transform: translateX(4px); }
.opt-btn.correct { border-color: var(--correct); background: #d1fae5; color: #065f46; }
.opt-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
.opt-btn:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: .9rem 1.1rem; font-weight: 700; font-size: .95rem; margin-bottom: 1rem; display: none; line-height: 1.4; }
.feedback.show { display: block; }
.feedback.correct { background: #d1fae5; color: #065f46; border: 2px solid #6ee7b7; }
.feedback.wrong { background: #fee2e2; color: #7f1d1d; border: 2px solid #fca5a5; }
.next-btn { background: linear-gradient(135deg, var(--primary), var(--light)); color: white; border: none; border-radius: 12px; padding: .85rem 2rem; font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; display: none; transition: transform .15s; }
.next-btn:hover { transform: scale(1.04); }
.next-btn.show { display: inline-block; }
.result-card { display: none; text-align: center; background: white; border-radius: 20px; padding: 2.5rem 1.5rem; box-shadow: 0 4px 24px rgba(180,83,9,.12); }
.result-card.show { display: block; }
.result-emoji { font-size: 4rem; margin-bottom: .5rem; }
.result-score { font-size: 3rem; font-weight: 900; color: var(--primary); margin: .5rem 0; }
.result-msg { font-size: 1.1rem; font-weight: 600; color: var(--neutral); margin-bottom: 1.5rem; }
.result-breakdown { background: var(--bg); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; font-size: .95rem; }
.back-btn { background: white; border: 2.5px solid var(--primary); color: var(--primary); border-radius: 12px; padding: .75rem 1.8rem; font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all .2s; }
.back-btn:hover { background: var(--primary); color: white; }
.card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(180,83,9,.08); margin-bottom: 1rem; border-top: 4px solid var(--primary); }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-emoji">🗿</div>
  <h1>Marcos de Memória</h1>
  <p>Quiz Interativo · 10 questões · História 5º ano</p>
</div>
<div class="container">
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress" style="width:10%"></div></div>
    <div class="card">
      <div class="q-label" id="q-label">Questão 1 de 10</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima questão →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <div class="result-emoji" id="result-emoji"></div>
    <div style="font-size:1.1rem;font-weight:700;color:#6b7280;margin-bottom:.3rem">Sua pontuação</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-breakdown" id="result-breakdown"></div>
    <button class="back-btn" onclick="window.close() || (window.location.href='../../index.html')">← Voltar ao Portal</button>
  </div>
</div>
<script>
const questions = [
  {
    q: "O que são marcos de memória?",
    opts: ["Placas de trânsito em cidades históricas", "Monumentos, objetos e espaços que os grupos sociais usam para guardar e transmitir suas memórias", "Documentos escritos guardados em museus", "Fotografias antigas de personagens históricos"],
    correct: 1,
    explanation: "Marcos de memória são monumentos, objetos, espaços e símbolos que os grupos sociais usam para preservar as memórias que consideram importantes para sua identidade e história."
  },
  {
    q: "O Cavaleiro Guaicuru, escultura localizada em Campo Grande (MS), foi feito de quais materiais e tem quantos metros de altura?",
    opts: ["Madeira e granito, 2 metros", "Bronze e mármore, mais de 4 metros", "Ferro e concreto, 6 metros", "Pedra e argila, 3 metros"],
    correct: 1,
    explanation: "O Cavaleiro Guaicuru, do artista Amir Mandas, é feito de bronze e mármore e tem mais de 4 metros de altura. É um importante monumento que representa o povo indígena Guaicuru."
  },
  {
    q: "Segundo a professora Hildete Pereira de Melo (UFF), como as mulheres eram representadas nos monumentos históricos das cidades?",
    opts: ["Como figuras públicas e históricas relevantes", "Como figuras religiosas ou alegorias, não como personagens históricas", "Como guerreiras e líderes políticas", "As mulheres eram igualmente representadas nos monumentos"],
    correct: 1,
    explanation: "Segundo Hildete Pereira de Melo, professora da UFF, as mulheres foram homenageadas principalmente como figuras religiosas ou alegorias, e não como figuras públicas e históricas — o que reflete uma exclusão histórica."
  },
  {
    q: "Quais grupos sociais eram frequentemente excluídos da representação nos monumentos das cidades brasileiras?",
    opts: ["Apenas os imigrantes europeus", "Mulheres, negros e indígenas", "Somente crianças e jovens", "Comerciantes e artesãos"],
    correct: 1,
    explanation: "Mulheres, negros e indígenas — que formam grande parte da população brasileira — eram e ainda são pouco representados nos monumentos e marcos de memória das cidades."
  },
  {
    q: "O que é o Cais do Valongo, localizado no Rio de Janeiro?",
    opts: ["Um porto de pesca tradicional do século XIX", "O principal porto de entrada de africanos escravizados no Brasil, entre 1779 e 1831", "Um mercado de escambo colonial português", "Um forte militar construído pelos holandeses"],
    correct: 1,
    explanation: "O Cais do Valongo foi o principal porto de entrada de africanos escravizados no Brasil, entre 1779 e 1831. Estima-se que mais de 500 mil pessoas chegaram ali acorrentadas."
  },
  {
    q: "Em que ano o Cais do Valongo foi declarado Patrimônio da Humanidade pela UNESCO?",
    opts: ["2005", "2010", "2017", "2023"],
    correct: 2,
    explanation: "O Cais do Valongo foi declarado Patrimônio da Humanidade pela UNESCO em 2017, reconhecendo sua importância como sítio arqueológico da memória da escravidão no Brasil."
  },
  {
    q: "O nome da cidade de TABATINGA (AM) tem origem em qual língua e significa o quê?",
    opts: ["Língua portuguesa — 'terra branca e úmida'", "Tupi — 'aldeia branca'", "Espanhol — 'terra dos guerreiros'", "Paiakã — 'bom, com muito peixe'"],
    correct: 1,
    explanation: "Tabatinga vem do Tupi e significa 'aldeia branca' — um exemplo de como a memória indígena está preservada nos nomes das cidades brasileiras."
  },
  {
    q: "O nome da cidade de PARACATU (MG) vem da língua Paiakã e significa:",
    opts: ["'Terra de barro vermelho'", "'Lugar de muitas pedras'", "'Bom, com muito peixe'", "'Rio das tarauacajás'"],
    correct: 2,
    explanation: "Paracatu vem do Paiakã e significa 'bom, com muito peixe' — uma referência ao Rio Paracatu, rico em peixes, que era fundamental para as populações indígenas da região."
  },
  {
    q: "O que significa o nome PARANAGUÁ (PR) em língua indígena?",
    opts: ["'Rio das garças brancas'", "'Semelhante ao mar' (para nd'yú'gua)", "'Terra de muitos frutos'", "'Aldeia dos pássaros'"],
    correct: 1,
    explanation: "Paranaguá vem de 'para nd'yú'gua', que significa 'semelhante ao mar' — uma referência à baia de Paranaguá, que lembra um mar pela sua extensão."
  },
  {
    q: "Por que é importante preservar lugares como o Cais do Valongo, mesmo que lembrem momentos dolorosos da história?",
    opts: ["Porque são apenas atrações turísticas lucrativas", "Porque esquecer é apagar — preservar é reconhecer a injustiça e garantir que não se repita", "Porque o governo é obrigado por lei a manter todos os sítios arqueológicos", "Porque são os únicos registros escritos sobre a escravidão no Brasil"],
    correct: 1,
    explanation: "Como disse o procurador Sergio Suiama, preservar o Cais do Valongo é reconhecer essa história e honrar os que sofreram. Esquecer é apagar — e apagar é permitir que injustiças se repitam."
  }
];

let current = 0, score = 0;

function loadQuestion() {
  const q = questions[current];
  document.getElementById('q-label').textContent = `Questão ${current + 1} de ${questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = `${((current + 1) / questions.length) * 100}%`;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').className = 'next-btn';
}

function selectAnswer(idx) {
  const q = questions[current];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  btns[q.correct].classList.add('correct');
  const fb = document.getElementById('feedback');
  if (idx === q.correct) {
    score++;
    btns[idx].classList.add('correct');
    fb.className = 'feedback correct show';
    fb.textContent = '✅ Correto! ' + q.explanation;
  } else {
    btns[idx].classList.add('wrong');
    fb.className = 'feedback wrong show';
    fb.textContent = '❌ Errado. ' + q.explanation;
  }
  document.getElementById('next-btn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < questions.length) loadQuestion();
  else showResult();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const card = document.getElementById('result-card');
  card.className = 'result-card show';
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('result-score').textContent = `${score}/${questions.length}`;
  let emoji, msg;
  if (pct >= 90) { emoji = '🏆'; msg = 'Excelente! Você é um guardião da memória!'; }
  else if (pct >= 70) { emoji = '🌟'; msg = 'Muito bem! Você conhece bem os marcos de memória.'; }
  else if (pct >= 50) { emoji = '📚'; msg = 'Bom esforço! Releia a HQ e tente novamente.'; }
  else { emoji = '💪'; msg = 'Continue estudando! A memória dos povos é importante.'; }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-breakdown').innerHTML = `<strong>Acertos:</strong> ${score} &nbsp;|&nbsp; <strong>Erros:</strong> ${questions.length - score} &nbsp;|&nbsp; <strong>Aproveitamento:</strong> ${pct}%`;
}

loadQuestion();
</script>

<!-- concluir-btn -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "hist";
  var THEME_SLUG = "marcos-memoria";
  var ACTIVITY_TYPE = "quiz";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Memo",
    characterEmoji: "🗿",
    characterImg:   "chars/marcos-memoria-hd.png",
    themeLabel:     "Marcos de Memória · História",
    totalActivities: 3,
    primaryColor: "#B45309",
    lightColor: "#F59E0B",
    bgColor: "#FFFBEB",
    glowRgb: "180,83,9",
    backUrl: '../../index.html#theme-hist-marcos-memoria',
    activityType: "quiz",
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#B45309,#F59E0B);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(180,83,9,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (btn.style.display === "none") {
      _capturedScore = (typeof window.sabendoScore === "number") ? Math.round(window.sabendoScore) : null;
      btn.style.display = "block";
    } else if (_capturedScore !== null) {
      btn.textContent = "\u2713 Nota desta sess\u00e3o: " + _capturedScore + "% \u00b7 Concluir";
      btn.style.background = "linear-gradient(135deg,#059669,#34D399)";
    }
  }

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito/i.test(sig)) showBtn();
      }
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#B45309,#F59E0B)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
</body>
</html>
