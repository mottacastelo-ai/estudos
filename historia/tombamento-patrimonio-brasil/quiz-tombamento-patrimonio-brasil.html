<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — O Tombamento e o Patrimônio no Brasil</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #B45309; --light: #F59E0B; --bg: #FFFBEB; --dark: #78350F; --correct: #059669; --wrong: #DC2626; --neutral: #374151; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Baloo 2', sans-serif; background: var(--bg); min-height: 100vh; color: var(--neutral); }
.hero { background: linear-gradient(135deg, #78350F, #B45309 60%, #F59E0B); padding: 2rem 1.5rem 1.5rem; text-align: center; color: white; }
.hero-emoji { font-size: 3rem; margin-bottom: .4rem; }
.hero h1 { font-size: 1.5rem; font-weight: 900; line-height: 1.2; }
.hero p { font-size: .9rem; opacity: .9; margin-top: .4rem; }
.container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.progress-bar-wrap { background: #e5e7eb; border-radius: 99px; height: 10px; margin: 1.2rem 0; }
.progress-bar { background: linear-gradient(90deg, var(--primary), var(--light)); height: 10px; border-radius: 99px; transition: width .4s; }
.q-label { font-family: 'Space Mono', monospace; font-size: .8rem; color: var(--primary); font-weight: 700; margin-bottom: .3rem; }
.q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; line-height: 1.4; }
.options { display: flex; flex-direction: column; gap: .7rem; margin-bottom: 1rem; }
.opt-btn { background: white; border: 2.5px solid #e5e7eb; border-radius: 12px; padding: .85rem 1.1rem; font-family: 'Baloo 2', sans-serif; font-size: .95rem; font-weight: 600; cursor: pointer; text-align: left; transition: all .2s; color: var(--neutral); }
.opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #fff7ed; transform: translateX(4px); }
.opt-btn.correct { border-color: var(--correct); background: #d1fae5; color: #065f46; }
.opt-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
.opt-btn:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: .9rem 1.1rem; font-weight: 700; font-size: .9rem; margin-bottom: 1rem; display: none; line-height: 1.5; }
.feedback.show { display: block; }
.feedback.correct { background: #d1fae5; color: #065f46; border: 2px solid #6ee7b7; }
.feedback.wrong { background: #fee2e2; color: #7f1d1d; border: 2px solid #fca5a5; }
.next-btn { background: linear-gradient(135deg, var(--primary), var(--light)); color: white; border: none; border-radius: 12px; padding: .85rem 2rem; font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; display: none; transition: transform .15s; }
.next-btn:hover { transform: scale(1.04); }
.next-btn.show { display: inline-block; }
.result-card { display: none; text-align: center; background: white; border-radius: 20px; padding: 2.5rem 1.5rem; box-shadow: 0 4px 24px rgba(180,83,9,.12); }
.result-card.show { display: block; }
.result-emoji { font-size: 4rem; margin-bottom: .5rem; }
.result-score { font-size: 3rem; font-weight: 900; color: var(--primary); margin: .5rem 0; }
.result-msg { font-size: 1rem; font-weight: 600; color: var(--neutral); margin-bottom: 1.5rem; }
.result-breakdown { background: var(--bg); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; font-size: .95rem; }
.back-btn { background: white; border: 2.5px solid var(--primary); color: var(--primary); border-radius: 12px; padding: .75rem 1.8rem; font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all .2s; }
.back-btn:hover { background: var(--primary); color: white; }
.card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(180,83,9,.08); margin-bottom: 1rem; border-top: 4px solid var(--primary); }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--primary); text-decoration: none; padding: 1rem 1rem 0; }
.back-link:hover { opacity: .7; }
</style>
</head>
<body>
<a class="back-link" onclick="voltarAoPortal()" href="#" style="display:block">← Voltar ao Portal</a>
<div class="hero">
  <div class="hero-emoji">📮</div>
  <h1>O Tombamento e o Patrimônio no Brasil</h1>
  <p>Quiz Interativo · 10 questões · História 5º ano</p>
</div>
<div class="container">
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="quiz-progress" style="width:10%"></div></div>
    <div class="card">
      <div class="q-label" id="q-label">Questão 1 de 10</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima questão →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <div class="result-emoji" id="result-emoji"></div>
    <div style="font-size:1.1rem;font-weight:700;color:#6b7280;margin-bottom:.3rem">Sua pontuação</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-breakdown" id="result-breakdown"></div>
    <button class="back-btn" onclick="voltarAoPortal()">← Voltar ao Portal</button>
  </div>
</div>
<script>
var quizQuestions = [
  {
    q: "O que é o tombamento?",
    opts: [
      "Uma lei que proíbe novas construções próximas a monumentos",
      "Um ato administrativo do Poder Público que preserva bens de valor histórico, cultural, arquitetônico, ambiental ou afetivo",
      "Um imposto cobrado de museus e colecionadores de arte",
      "Uma premiação dada a cidades com arquitetura bem conservada"
    ],
    correct: 1,
    explanation: "O tombamento é um ato administrativo do Poder Público que, por meio de legislação específica, preserva bens de valor histórico, cultural, arquitetônico, ambiental ou afetivo, impedindo sua destruição ou descaracterização."
  },
  {
    q: "Quais são as esferas que podem realizar o tombamento de um bem no Brasil?",
    opts: [
      "Escolar, religiosa e científica",
      "Municipal, estadual e federal",
      "Local, regional e continental",
      "Privada, pública e internacional"
    ],
    correct: 1,
    explanation: "O tombamento pode ser realizado pelas esferas municipal (prefeitura), estadual (governo do estado) e federal (governo federal), conforme a importância do bem para a comunidade local, o estado ou o país."
  },
  {
    q: "Qual opção apresenta exemplos de bens MÓVEIS que podem ser tombados?",
    opts: [
      "Edifícios históricos, praças e ruas antigas",
      "Florestas, cascatas e parques naturais",
      "Fotografias, livros, mobiliários, utensílios e obras de arte",
      "Cidades inteiras, bairros históricos e regiões culturais"
    ],
    correct: 2,
    explanation: "Os bens móveis tombáveis incluem fotografias, livros, mobiliários, utensílios e obras de arte — objetos que podem ser movidos. Os bens imóveis incluem edifícios, ruas, praças, cidades, regiões, florestas e cascatas."
  },
  {
    q: "O que o tombamento impede que aconteça com o bem protegido?",
    opts: [
      "Que seja estudado por pesquisadores e historiadores",
      "Que receba visitantes e turistas nacionais",
      "Sua destruição ou descaracterização",
      "Que novos estabelecimentos se instalem próximos a ele"
    ],
    correct: 2,
    explanation: "O tombamento impede a destruição ou descaracterização do bem tombado, garantindo que suas características originais sejam preservadas para as gerações futuras."
  },
  {
    q: "O Centro Histórico de Olinda, em Pernambuco, recebeu qual reconhecimento de proteção?",
    opts: [
      "Tombamento exclusivo pelo município de Olinda",
      "Título de Patrimônio Cultural da Humanidade pela UNESCO",
      "Proteção como Área de Preservação Ambiental Federal",
      "Registro como Patrimônio Cultural Imaterial do Nordeste"
    ],
    correct: 1,
    explanation: "O Centro Histórico de Olinda foi reconhecido como Patrimônio Cultural da Humanidade pela UNESCO em 1982, sendo um dos primeiros conjuntos arquitetônicos brasileiros a receber esse título."
  },
  {
    q: "O Frevo, dança e música típica do Nordeste, recebeu qual tipo de proteção cultural?",
    opts: [
      "Tombamento federal como Patrimônio Material Histórico",
      "Tombamento estadual pelo governo de Pernambuco",
      "Reconhecimento como Patrimônio Cultural Imaterial da Humanidade",
      "Proteção como Patrimônio Natural da Humanidade"
    ],
    correct: 2,
    explanation: "O Frevo foi reconhecido pela UNESCO como Patrimônio Cultural Imaterial da Humanidade em 2012, mostrando que a proteção cultural abrange também manifestações vivas — danças, músicas e tradições."
  },
  {
    q: "Trechos do litoral brasileiro cobertos pela Mata Atlântica receberam qual proteção internacional?",
    opts: [
      "Tombamento federal como Floresta Nacional",
      "Título de Patrimônio Natural da Humanidade pela UNESCO",
      "Área de Preservação Permanente exclusiva do sul do país",
      "Reconhecimento como Patrimônio Cultural Imaterial Ambiental"
    ],
    correct: 1,
    explanation: "Trechos do litoral com Mata Atlântica foram reconhecidos como Patrimônio Natural da Humanidade pela UNESCO em 1995, demonstrando que bens naturais — como florestas — também podem ser tombados e protegidos."
  },
  {
    q: "O Conjunto Arquitetônico da Pampulha, em Belo Horizonte (MG), recebeu o título de Patrimônio Cultural da Humanidade. Essa proteção foi concedida por qual organização?",
    opts: [
      "Governo do Estado de Minas Gerais",
      "Instituto do Patrimônio Histórico e Artístico Nacional (IPHAN)",
      "Organização das Nações Unidas para a Educação, Ciência e Cultura (UNESCO)",
      "Ministério do Turismo do Brasil"
    ],
    correct: 2,
    explanation: "O Conjunto Arquitetônico da Pampulha, reconhecido em 2016, recebeu o título de Patrimônio Cultural da Humanidade da UNESCO, o organismo responsável por reconhecer bens de valor universal excepcional."
  },
  {
    q: "O Farol da Barra, em Salvador (BA), é um bem tombado. Por qual esfera de governo ele foi protegido?",
    opts: [
      "Municipal — apenas pela Prefeitura de Salvador",
      "Estadual — pelo governo da Bahia",
      "Federal — pelo governo federal, por meio do IPHAN",
      "Internacional — pelo governo de Portugal, por ser obra colonial"
    ],
    correct: 2,
    explanation: "O Farol da Barra foi tombado em 1938 pelo IPHAN (Instituto do Patrimônio Histórico e Artístico Nacional), que é um órgão federal. É um dos tombamentos mais antigos do Brasil."
  },
  {
    q: "Uma moradora descobre que um casarão histórico do seu bairro será demolido. Qual é a medida de proteção correta a ser buscada?",
    opts: [
      "Cobrir a fachada com cartazes para impedir a demolição",
      "Solicitar o tombamento do bem junto ao Poder Público",
      "Comprar o casarão para convertê-lo em museu particular",
      "Registrar o casarão em um site de viagens para aumentar o turismo"
    ],
    correct: 1,
    explanation: "Para proteger oficialmente um bem histórico, a medida correta é solicitar o tombamento ao Poder Público (municipal, estadual ou federal) — o instrumento legal que impede a destruição ou descaracterização de bens com valor histórico, cultural, arquitetônico, ambiental ou afetivo."
  }
];

var currentQIndex = 0;
var quizHits = 0;
var quizAnswered = false;

function renderQuestion() {
  var q = quizQuestions[currentQIndex];
  document.getElementById('q-label').textContent = 'Questão ' + (currentQIndex + 1) + ' de 10';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('quiz-progress').style.width = ((currentQIndex + 1) / 10 * 100) + '%';
  var optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.opts.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', function() { selectOption(i); });
    optsEl.appendChild(btn);
  });
  var fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('next-btn').className = 'next-btn';
  quizAnswered = false;
}

function selectOption(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  var q = quizQuestions[currentQIndex];
  var btns = document.querySelectorAll('.opt-btn');
  btns.forEach(function(b, i) {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx && idx !== q.correct) b.classList.add('wrong');
  });
  var fb = document.getElementById('feedback');
  if (idx === q.correct) {
    quizHits++;
    fb.className = 'feedback correct show';
    fb.textContent = '✓ ' + q.explanation;
  } else {
    fb.className = 'feedback wrong show';
    fb.textContent = '✗ ' + q.explanation;
  }
  document.getElementById('next-btn').className = 'next-btn show';
}

function nextQuestion() {
  currentQIndex++;
  if (currentQIndex < quizQuestions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  var pct = Math.round((quizHits / quizQuestions.length) * 100);
  window.sabendoScore = pct;
  var rc = document.getElementById('result-card');
  rc.className = 'result-card show';
  var emojis = ['😕', '🙂', '😊', '🌟', '🏆'];
  var eIdx = quizHits <= 3 ? 0 : quizHits <= 5 ? 1 : quizHits <= 7 ? 2 : quizHits <= 9 ? 3 : 4;
  document.getElementById('result-emoji').textContent = emojis[eIdx];
  document.getElementById('result-score').textContent = quizHits + '/10';
  var msgs = ['Continue estudando! O tombamento protege nossa história. 💪', 'Bom começo! Revise os conceitos de tombamento. 📚', 'Muito bem! Você conhece bem o patrimônio brasileiro. 🎉', 'Ótimo! Você domina o tombamento e o patrimônio! ⭐', 'Perfeito! Manda bem, guardião do patrimônio! 🏆'];
  document.getElementById('result-msg').textContent = msgs[eIdx];
  document.getElementById('result-breakdown').textContent = 'Você acertou ' + quizHits + ' de 10 questões (' + pct + '% de aproveitamento)';
}

renderQuestion();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "hist";
  var THEME_SLUG = "tombamento-patrimonio-brasil";
  var ACTIVITY_TYPE = "quiz";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Carimbo",
    characterEmoji: "📮",
    characterImg:   "chars/tombamento-patrimonio-brasil-hd.png",
    themeLabel:     "O Tombamento e o Patrimônio no Brasil · História",
    totalActivities: 4,
    primaryColor: "#B45309",
    lightColor: "#F59E0B",
    bgColor: "#FFFBEB",
    glowRgb: "180,83,9",
    backUrl: "../../index.html#theme-hist-tombamento-patrimonio-brasil",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#B45309,#F59E0B);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(180,83,9,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#B45309,#F59E0B)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
<script src="../../shared/portal-back.js"></script>
</body>
