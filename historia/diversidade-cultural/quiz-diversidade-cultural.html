<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Diversidade Cultural Brasileira</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary:#15803D; --light:#4ADE80; --bg:#F0FDF4; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Baloo 2",cursive;background:var(--bg);color:#1A1A2E;min-height:100vh}
.hero{background:linear-gradient(135deg,#14532D,#15803D 60%,#4ADE80);padding:40px 24px 36px;color:white;text-align:center}
.hero-badge{display:inline-block;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 16px;border-radius:20px;margin-bottom:14px}
.hero h1{font-family:"Space Mono",monospace;font-size:26px;margin-bottom:8px;line-height:1.2}
.hero p{font-size:14px;font-weight:600;opacity:.85}
.container{max-width:680px;margin:0 auto;padding:32px 20px}
.progress-bar-wrap{background:#d1fae5;border-radius:20px;height:8px;margin-bottom:28px;overflow:hidden}
.progress-bar{height:8px;background:var(--primary);border-radius:20px;transition:width .4s ease;width:0%}
.question-card{background:white;border:2px solid #d1fae5;border-radius:20px;padding:28px;margin-bottom:20px}
.q-num{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);margin-bottom:10px}
.q-text{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:#f0fdf4;border:2px solid #d1fae5;border-radius:14px;padding:13px 18px;font-family:"Baloo 2",cursive;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:all .18s;color:#1A1A2E}
.opt-btn:hover:not(:disabled){background:#dcfce7;border-color:var(--primary);transform:translateX(4px)}
.opt-btn.correct{background:#d1fae5;border-color:#15803D;color:#14532D}
.opt-btn.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.opt-btn:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.ok{background:#d1fae5;color:#14532D;border:1.5px solid #86efac}
.feedback.err{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5}
.next-btn{display:block;margin:16px auto 0;background:var(--primary);color:white;border:none;border-radius:14px;padding:13px 32px;font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;cursor:pointer;display:none;transition:transform .15s}
.next-btn:hover{transform:translateY(-2px)}
.result-card{background:white;border:2px solid #d1fae5;border-radius:24px;padding:40px 28px;text-align:center;display:none}
.result-emoji{font-size:64px;margin-bottom:16px}
.result-score{font-family:"Space Mono",monospace;font-size:48px;color:var(--primary);margin-bottom:8px}
.result-msg{font-size:16px;font-weight:700;margin-bottom:24px;color:#374151}
.result-sub{font-size:13px;font-weight:600;color:#6B7280;line-height:1.6;margin-bottom:28px}
.restart-btn{background:var(--primary);color:white;border:none;border-radius:14px;padding:14px 36px;font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;cursor:pointer;margin:0 6px}
.back-btn{background:white;color:var(--primary);border:2px solid var(--primary);border-radius:14px;padding:13px 28px;font-family:"Baloo 2",cursive;font-size:14px;font-weight:800;cursor:pointer;margin:0 6px}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-badge">🌍 Geografia — 5º Ano</div>
  <h1>Diversidade Cultural<br>Brasileira</h1>
  <p>10 questões · Festas, danças e manifestações culturais</p>
</div>
<div class="container">
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizArea"></div>
  <div class="result-card" id="resultCard">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="restart-btn" onclick="restart()">🔄 Jogar de novo</button>
    <button class="back-btn" onclick="voltarAoPortal()">← Voltar ao Portal</button>
  </div>
</div>
<script>
const questions = [
  {
    q: "O que é pluralidade cultural?",
    opts: [
      "A existência de apenas uma cultura dominante no Brasil",
      "A diversidade de grupos étnico-culturais com diferentes hábitos alimentares e formas de falar",
      "A mistura de culturas somente africanas e europeias",
      "A uniformidade dos costumes em todo o território nacional"
    ],
    correct: 1,
    fb: "Pluralidade cultural é exatamente isso: a existência de muitos grupos étnico-culturais com diferentes hábitos, formas de falar e manifestações culturais — o que torna o Brasil um país plural!"
  },
  {
    q: "O Festival Folclórico de Parintins acontece em qual estado?",
    opts: ["Maranhão","Pará","Amazonas","Goiás"],
    correct: 2,
    fb: "O Festival Folclórico de Parintins ocorre no município de Parintins, no estado do Amazonas, no mês de junho. Ele é marcado pela disputa entre o Boi Caprichoso e o Boi Garantido."
  },
  {
    q: "O Festival Folclórico de Parintins é marcado pela disputa entre quais personagens?",
    opts: [
      "Saci e Cuca",
      "Boi Caprichoso e Boi Garantido",
      "Bumba e Meu Boi",
      "Boi Bumbá e Boi Pantaneiro"
    ],
    correct: 1,
    fb: "O festival recria a lenda sobre a morte e a ressurreição de um boi, com danças, músicas e encenações. A grande rivalidade é entre o Boi Caprichoso e o Boi Garantido."
  },
  {
    q: "A Cavalhada é uma festa popular do estado de:",
    opts: ["Mato Grosso do Sul","São Paulo","Goiás","Rio Grande do Sul"],
    correct: 2,
    fb: "A Cavalhada é uma festa popular no estado de Goiás que recria as batalhas medievais com homens montados em cavalos."
  },
  {
    q: "O Siriri é uma dança praticada nos estados de:",
    opts: [
      "Pará e Amazonas",
      "Mato Grosso e Mato Grosso do Sul",
      "Paraná e São Paulo",
      "Minas Gerais e Goiás"
    ],
    correct: 1,
    fb: "O Siriri é uma dança popular nos estados de Mato Grosso e Mato Grosso do Sul. Ao som de instrumentos como a viola de cocho, o ganzá e o tamboril, essa dança é praticada em rodas ou fileiras."
  },
  {
    q: "O Fandango caiçara é uma dança tradicional das comunidades caiçaras localizadas no litoral dos estados de:",
    opts: [
      "Rio de Janeiro e Espírito Santo",
      "Bahia e Pernambuco",
      "Paraná e São Paulo",
      "Santa Catarina e Rio Grande do Sul"
    ],
    correct: 2,
    fb: "O Fandango caiçara é tradicional das comunidades caiçaras do litoral do Paraná e de São Paulo. As batidas de tamanco e o som de violas, rabecas e machetes dão ritmo à coreografia."
  },
  {
    q: "O Círio de Nazaré é uma celebração religiosa realizada em homenagem a Nossa Senhora de Nazaré. Ela acontece no município de:",
    opts: ["São Luís","Belém","Manaus","Fortaleza"],
    correct: 1,
    fb: "O Círio de Nazaré acontece no município de Belém, no estado do Pará, no mês de outubro. Atrai milhões de devotos anualmente e inclui uma procissão com santa protetora dos navegantes."
  },
  {
    q: "O Bumba meu boi é uma festa popular principalmente do estado do:",
    opts: ["Goiás","Bahia","Maranhão","Pernambuco"],
    correct: 2,
    fb: "O Bumba meu boi é festa popular no estado do Maranhão, na qual o boi é personagem principal. Em outros lugares do Brasil, essa festa é conhecida como Boi de Reis, Boi Pintadinho, entre outros."
  },
  {
    q: "Qual das opções a seguir é uma manifestação cultural do lugar de viver estudada no capítulo?",
    opts: [
      "Só as festas juninas e o carnaval",
      "Apenas as danças importadas de outros países",
      "Música popular, culinária, festas e folias, lendas e expressões e ditos populares",
      "Unicamente as manifestações religiosas"
    ],
    correct: 2,
    fb: "As manifestações culturais do lugar de viver incluem: música popular, culinária, festas e folias, lendas e expressões e ditos populares — mostrando a riqueza cultural de cada região do Brasil."
  },
  {
    q: "A Folia de Reis é uma celebração realizada principalmente nos meses de dezembro e janeiro. Ela tem destaque nos estados de:",
    opts: [
      "Amazonas e Pará",
      "Rio de Janeiro e Bahia",
      "Minas Gerais e Goiás",
      "Rio Grande do Sul e Santa Catarina"
    ],
    correct: 2,
    fb: "A Folia de Reis é uma celebração religiosa realizada entre os meses de dezembro e janeiro, com destaque em Minas Gerais e Goiás. Em forma de procissão, grupos de pessoas cantam e dançam pelas ruas."
  }
];

let current = 0, score = 0, answered = false;

function render() {
  if (current >= questions.length) { showResult(); return; }
  const q = questions[current];
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  let html = `<div class="question-card">
    <div class="q-num">Questão ${current+1} de ${questions.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">`;
  q.opts.forEach((o,i) => {
    html += `<button class="opt-btn" id="opt${i}" onclick="answer(${i})">${o}</button>`;
  });
  html += `</div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">${current < questions.length-1 ? 'Próxima →' : 'Ver resultado 🎉'}</button>
  </div>`;
  document.getElementById('quizArea').innerHTML = html;
  answered = false;
}

function answer(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const fb = document.getElementById('fb');
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  if (i === q.correct) {
    score++;
    document.getElementById('opt'+i).classList.add('correct');
    fb.className = 'feedback show ok';
    fb.innerHTML = '✅ ' + q.fb;
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    document.getElementById('opt'+q.correct).classList.add('correct');
    fb.className = 'feedback show err';
    fb.innerHTML = '❌ ' + q.fb;
  }
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQ() { current++; render(); }

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizArea').innerHTML = '';
  const card = document.getElementById('resultCard');
  card.style.display = 'block';
  const pct = Math.round(score/questions.length*100);
  window.sabendoScore = pct;
  let emoji, msg, sub;
  if (pct === 100)      { emoji='🏆'; msg='Perfeito! Você arrasou!'; sub='Você conhece muito bem a diversidade cultural brasileira. Parabéns!'; }
  else if (pct >= 70)  { emoji='🌟'; msg='Muito bem!'; sub='Você domina o conteúdo. Revise as questões que errou para fixar ainda mais!'; }
  else if (pct >= 50)  { emoji='👍'; msg='Bom esforço!'; sub='Você está no caminho certo. Releia o conteúdo e tente de novo!'; }
  else                  { emoji='📚'; msg='Continue estudando!'; sub='Revise as festas, danças e manifestações culturais brasileiras e tente novamente. Vai conseguir!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = score + '/' + questions.length;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultSub').textContent = sub;
}

function restart() {
  current = 0; score = 0;
  document.getElementById('resultCard').style.display = 'none';
  render();
}

render();
</script>

<!-- concluir-btn -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "geo";
  var THEME_SLUG = "diversidade-cultural";
  var ACTIVITY_TYPE = "quiz";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Prof. Geografina",
    characterEmoji: "🎪",
    characterImg:   "chars/diversidade-cultural-hd.png",
    themeLabel:     "Diversidade Cultural · Geografia",
    totalActivities: 4,
    primaryColor: "#15803D",
    lightColor: "#4ADE80",
    bgColor: "#F0FDF4",
    glowRgb: "21,128,61",
    backUrl: '../../index.html#theme-geo-diversidade-cultural',
    activityType: "quiz",
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#15803D,#4ADE80);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(21,128,61,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  // Detecta window.sabendoScore sendo setado por qualquer atividade
  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {
    // fallback se ja foi definido
  }

  // Fallback: evento customizado para criadores/wizards (sem score numerico)
  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  // Fallback MutationObserver para atividades legadas que nao setam sabendoScore
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#15803D,#4ADE80)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var score = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: score, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
<script src="../../shared/portal-back.js"></script>
</body>
</html>
