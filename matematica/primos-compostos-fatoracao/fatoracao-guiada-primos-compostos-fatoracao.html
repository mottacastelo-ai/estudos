<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatoração Guiada — Primos e Fatoração</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#059669;--light:#34D399;--bg:#ECFDF5;--dark:#064E3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',cursive;background:var(--bg);min-height:100vh;padding:16px}
.header{background:linear-gradient(135deg,var(--dark),var(--primary));border-radius:16px;padding:20px 24px;color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.header-emoji{font-size:48px;line-height:1}
.header h1{font-family:'Space Mono',monospace;font-size:18px;margin-bottom:4px}
.header p{font-size:14px;opacity:.85}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;border:2px solid #D1FAE5}
.card h2{font-size:16px;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.instrucao{background:var(--bg);border-left:4px solid var(--primary);padding:12px 16px;border-radius:0 12px 12px 0;font-size:14px;color:var(--dark);margin-bottom:16px}
.numeros-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.num-btn{padding:10px 18px;border:2px solid #D1FAE5;border-radius:12px;background:#fff;font-family:'Space Mono',monospace;font-size:17px;font-weight:700;cursor:pointer;color:var(--dark);transition:all .2s}
.num-btn:hover{border-color:var(--primary);background:var(--bg)}
.num-btn.ativo{border-color:var(--primary);background:var(--primary);color:#fff}
.num-btn.feito{border-color:#D1FAE5;background:#D1FAE5;color:#065F46;cursor:default}
.arena{display:none}
.arena.visivel{display:block}
.numero-atual{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;color:var(--dark);text-align:center;margin-bottom:20px;padding:16px;background:var(--bg);border-radius:12px;border:2px solid #D1FAE5}
.arvore-wrap{display:flex;justify-content:center;margin-bottom:20px}
.arvore{display:flex;flex-direction:column;align-items:center;gap:0}
.step-row{display:flex;align-items:center;gap:0;font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
.step-dividendo{width:72px;text-align:right;padding-right:4px;color:var(--dark)}
.step-barra{width:20px;text-align:center;color:#9CA3AF;font-size:20px}
.step-divisor{width:56px;padding-left:4px;color:var(--primary)}
.step-quociente{display:none}
.divisores-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.div-btn{padding:12px 20px;border:2px solid var(--primary);border-radius:12px;background:#fff;font-family:'Space Mono',monospace;font-size:20px;font-weight:700;cursor:pointer;color:var(--primary);transition:all .2s;min-width:60px}
.div-btn:hover{background:var(--bg)}
.div-btn:disabled{opacity:.35;cursor:not-allowed}
.feedback-step{text-align:center;font-size:14px;min-height:22px;margin-bottom:8px;font-weight:700}
.feedback-step.ok{color:var(--primary)}
.feedback-step.nok{color:#EF4444}
.resultado-fat{display:none;background:linear-gradient(135deg,var(--dark),var(--primary));border-radius:14px;padding:20px;color:#fff;text-align:center;margin-top:8px}
.resultado-fat .fat-final{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.resultado-fat .fat-msg{font-size:14px;opacity:.9}
.placar-geral{display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.placar-item{background:#fff;border-radius:12px;padding:12px 20px;border:2px solid #D1FAE5;text-align:center}
.placar-item .val{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--primary)}
.placar-item .lab{font-size:12px;color:#6B7280}
.btn-proximo{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--light));color:#fff;border:none;border-radius:12px;font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px;display:none}
.resultado-final{display:none;background:linear-gradient(135deg,var(--dark),var(--primary));border-radius:16px;padding:24px;color:#fff;text-align:center}
.resultado-final .score-big{font-size:64px;font-weight:900;font-family:'Space Mono',monospace}
.resultado-final .score-msg{font-size:16px;margin-top:8px;opacity:.9}
</style>
</head>
<body>

<div class="header">
  <div class="header-emoji">🔍</div>
  <div>
    <h1>Fatoração Guiada</h1>
    <p>Primos, Compostos e Fatoração · Matemática 5º ano</p>
  </div>
</div>

<div class="card">
  <h2>🌲 Monte a árvore de fatores</h2>
  <div class="instrucao">Escolha um número e depois selecione <strong>por qual primo dividir</strong> em cada passo. Continue até o quociente ser 1. O Primo vai te guiando!</div>

  <div class="placar-geral" id="placar-geral">
    <div class="placar-item"><div class="val" id="pl-acertos">0</div><div class="lab">acertos</div></div>
    <div class="placar-item"><div class="val" id="pl-erros">0</div><div class="lab">erros</div></div>
    <div class="placar-item"><div class="val" id="pl-feitos">0/5</div><div class="lab">números</div></div>
  </div>

  <div class="numeros-grid" id="numeros-grid">
    <button class="num-btn" onclick="escolherNumero(60,this)">60</button>
    <button class="num-btn" onclick="escolherNumero(84,this)">84</button>
    <button class="num-btn" onclick="escolherNumero(90,this)">90</button>
    <button class="num-btn" onclick="escolherNumero(120,this)">120</button>
    <button class="num-btn" onclick="escolherNumero(180,this)">180</button>
  </div>

  <div class="arena" id="arena">
    <div class="numero-atual" id="numero-atual">—</div>
    <div class="arvore-wrap"><div class="arvore" id="arvore"></div></div>
    <div class="feedback-step" id="feedback-step"></div>
    <div class="divisores-btns" id="divisores-btns">
      <button class="div-btn" onclick="tentar(2)">2</button>
      <button class="div-btn" onclick="tentar(3)">3</button>
      <button class="div-btn" onclick="tentar(5)">5</button>
      <button class="div-btn" onclick="tentar(7)">7</button>
    </div>
    <div class="resultado-fat" id="resultado-fat">
      <div class="fat-final" id="fat-final"></div>
      <div class="fat-msg" id="fat-msg"></div>
    </div>
    <button class="btn-proximo" id="btn-proximo" onclick="proximoNumero()">→ Próximo número</button>
  </div>

  <div class="resultado-final" id="resultado-final">
    <div class="score-big" id="score-big"></div>
    <div class="score-msg" id="score-msg"></div>
  </div>
</div>

<script>
var acertos = 0, erros = 0, feitos = 0;
var atual = 0, passos = [], fatores = [], btnAtual = null;
var total = 5;

var gabaritos = {
  60:  [2,2,3,5],
  84:  [2,2,3,7],
  90:  [2,3,3,5],
  120: [2,2,2,3,5],
  180: [2,2,3,3,5]
};

function escolherNumero(n, btn) {
  if (btn.classList.contains('feito')) return;
  document.querySelectorAll('.num-btn').forEach(function(b) { if (!b.classList.contains('feito')) b.classList.remove('ativo'); });
  btn.classList.add('ativo');
  btnAtual = btn;
  atual = n;
  fatores = [];
  passos = [n];
  document.getElementById('numero-atual').textContent = n;
  document.getElementById('arena').classList.add('visivel');
  document.getElementById('resultado-fat').style.display = 'none';
  document.getElementById('btn-proximo').style.display = 'none';
  document.getElementById('feedback-step').textContent = '';
  document.getElementById('feedback-step').className = 'feedback-step';
  document.querySelectorAll('.div-btn').forEach(function(b) { b.disabled = false; });
  renderArvore();
}

function renderArvore() {
  var arv = document.getElementById('arvore');
  arv.innerHTML = '';
  for (var i = 0; i < fatores.length; i++) {
    var row = document.createElement('div');
    row.className = 'step-row';
    row.innerHTML = '<span class="step-dividendo">' + passos[i] + '</span><span class="step-barra">|</span><span class="step-divisor">' + fatores[i] + '</span>';
    arv.appendChild(row);
  }
  if (passos.length > 0) {
    var ultQ = passos[passos.length - 1];
    if (fatores.length > 0 && ultQ > 1) {
      var row2 = document.createElement('div');
      row2.className = 'step-row';
      row2.innerHTML = '<span class="step-dividendo">' + ultQ + '</span><span class="step-barra" style="color:#D1FAE5">|</span><span class="step-divisor" style="color:#D1FAE5">?</span>';
      arv.appendChild(row2);
    }
  }
}

function tentar(primo) {
  var quociente = passos[passos.length - 1];
  var fb = document.getElementById('feedback-step');
  if (quociente % primo === 0) {
    acertos++;
    fatores.push(primo);
    passos.push(quociente / primo);
    fb.textContent = '✓ ' + quociente + ' ÷ ' + primo + ' = ' + (quociente / primo);
    fb.className = 'feedback-step ok';
    renderArvore();
    document.getElementById('pl-acertos').textContent = acertos;
    var novoQ = passos[passos.length - 1];
    if (novoQ === 1) {
      concluirFatoracao();
    }
  } else {
    erros++;
    fb.textContent = '✗ ' + quociente + ' não é divisível por ' + primo + '. Tente outro!';
    fb.className = 'feedback-step nok';
    document.getElementById('pl-erros').textContent = erros;
  }
  atualizarPlacar();
}

function concluirFatoracao() {
  feitos++;
  document.getElementById('pl-feitos').textContent = feitos + '/' + total;
  document.querySelectorAll('.div-btn').forEach(function(b) { b.disabled = true; });
  var res = document.getElementById('resultado-fat');
  var exp = atual + ' = ' + fatores.join(' × ');
  document.getElementById('fat-final').textContent = exp;
  var pot = calcPotencias(fatores);
  document.getElementById('fat-msg').textContent = '✓ Fatoração completa! ' + exp + (pot !== exp ? ' = ' + pot : '');
  res.style.display = 'block';
  if (btnAtual) { btnAtual.classList.remove('ativo'); btnAtual.classList.add('feito'); btnAtual.disabled = true; }
  var btn = document.getElementById('btn-proximo');
  if (feitos < total) { btn.style.display = 'block'; btn.textContent = '→ Próximo número'; }
  else { btn.style.display = 'block'; btn.textContent = '🏁 Ver resultado final'; btn.onclick = mostrarFinal; }
}

function calcPotencias(fatores) {
  var contagem = {};
  fatores.forEach(function(f) { contagem[f] = (contagem[f] || 0) + 1; });
  return Object.keys(contagem).sort(function(a,b){return a-b;}).map(function(k) {
    return contagem[k] > 1 ? k + (contagem[k] === 2 ? '²' : contagem[k] === 3 ? '³' : '^' + contagem[k]) : k;
  }).join(' × ');
}

function proximoNumero() {
  document.getElementById('arena').classList.remove('visivel');
  document.getElementById('arena').classList.remove('visivel');
  document.getElementById('btn-proximo').style.display = 'none';
}

function mostrarFinal() {
  var pct = Math.round((acertos / (acertos + erros)) * 100);
  window.sabendoScore = pct;
  document.getElementById('resultado-final').style.display = 'block';
  document.getElementById('score-big').textContent = pct + '%';
  var msgs = ['Continue praticando! Revise como escolher o menor primo divisor.', 'Bom trabalho! Você está entendendo o processo!', 'Muito bem! Você faz fatorações como um detetive! 🔍', 'Perfeito! Primo ficaria orgulhoso de você! 🏆'];
  document.getElementById('score-msg').textContent = pct < 50 ? msgs[0] : pct < 75 ? msgs[1] : pct < 90 ? msgs[2] : msgs[3];
  document.getElementById('arena').classList.remove('visivel');
  document.getElementById('btn-proximo').style.display = 'none';
  document.querySelector('.numeros-grid').style.display = 'none';
}

function atualizarPlacar() {
  document.getElementById('pl-acertos').textContent = acertos;
  document.getElementById('pl-erros').textContent = erros;
}
</script>

      if (m.attributeName==="class" && el.classList && el.classList.contains("show")) { var s2=(el.id||"")+" "+(el.className||""); if(/result|score|gabarito|feedback|correc/i.test(s2)) showBtn(); }

</html>
