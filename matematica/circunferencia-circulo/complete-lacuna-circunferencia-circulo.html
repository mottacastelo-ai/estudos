<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete a Lacuna — Circunferência e Círculo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --mat: #059669; --mat-light: #34D399; --mat-bg: #ECFDF5;
  --bg: #ECFDF5; --card: #fff; --text: #1A1A2E; --muted: #6B7280; --border: #D1FAE5;
  --radius: 18px;
}
body { font-family: "Baloo 2", cursive; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 80px; }
.wrap { max-width: 700px; margin: 0 auto; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--mat); text-decoration: none; margin-bottom: 16px; cursor: pointer; }
.back-link:hover { opacity: .7; }
.card-header { background: linear-gradient(135deg, #064E3B, #059669 60%, #34D399); border-radius: 20px 20px 0 0; padding: 20px 24px 16px; display: flex; align-items: center; gap: 14px; }
.card-header .hicon { font-size: 30px; }
.card-header h1 { font-family: "Space Mono", monospace; font-size: 16px; color: #fff; }
.card-header p { font-size: 12px; color: rgba(255,255,255,.8); font-weight: 600; margin-top: 2px; }
.hbadge { margin-left: auto; background: rgba(255,255,255,.2); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 999px; white-space: nowrap; border: 1px solid rgba(255,255,255,.3); }
.activity-body { background: var(--card); border: 2px solid var(--border); border-top: none; border-radius: 0 0 20px 20px; padding: 20px; }

/* Progress */
.prog-wrap { margin-bottom: 16px; }
.prog-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.prog-label { font-size: 12px; font-weight: 700; color: var(--muted); }
.prog-score { font-size: 12px; font-weight: 800; color: var(--mat); }
.prog-track { height: 8px; background: var(--mat-bg); border-radius: 999px; }
.prog-fill { height: 8px; background: linear-gradient(90deg, #059669, #34D399); border-radius: 999px; transition: width .4s; }

/* Sentence card */
.sentence-card { background: var(--mat-bg); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.sentence-num { font-size: 11px; font-weight: 800; color: var(--mat); letter-spacing: .06em; margin-bottom: 10px; }
.sentence-text { font-size: 16px; font-weight: 700; line-height: 1.8; color: var(--text); }
.blank { display: inline-block; min-width: 140px; border-bottom: 3px solid var(--mat); text-align: center; padding: 0 8px; font-weight: 800; color: var(--mat); vertical-align: middle; transition: all .2s; border-radius: 4px 4px 0 0; }
.blank.filled-correct { background: #D1FAE5; color: #064E3B; border-bottom-color: #059669; border-radius: 6px; border: 2px solid #059669; }
.blank.filled-wrong   { background: #FEE2E2; color: #7F1D1D; border-bottom-color: #DC2626; border-radius: 6px; border: 2px solid #DC2626; text-decoration: line-through; }

/* Options */
.options-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.opt-chip { font-family: "Baloo 2", cursive; font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 999px; border: 2px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; transition: all .15s; }
.opt-chip:hover:not(:disabled) { border-color: var(--mat-light); background: var(--mat-bg); color: var(--mat); }
.opt-chip:disabled { cursor: default; opacity: .5; }
.opt-chip.used { opacity: .3; cursor: default; }

/* Feedback */
.feedback { display: none; padding: 12px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
.feedback.correct { background: #D1FAE5; border: 2px solid #059669; color: #064E3B; display: flex; gap: 10px; }
.feedback.wrong   { background: #FEE2E2; border: 2px solid #DC2626; color: #7F1D1D; display: flex; gap: 10px; }
.feedback-icon { font-size: 18px; flex-shrink: 0; }

/* Nav */
.nav-row { display: flex; justify-content: flex-end; }
.btn-next { font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 800; padding: 10px 28px; border-radius: 999px; border: none; background: linear-gradient(135deg,#059669,#34D399); color: white; cursor: pointer; display: none; box-shadow: 0 4px 12px rgba(5,150,105,.3); transition: transform .1s; }
.btn-next:hover { transform: scale(1.03); }

/* Result */
.result-panel { display: none; text-align: center; padding: 20px; }
.result-emoji { font-size: 52px; margin-bottom: 10px; }
.result-title { font-family: "Space Mono", monospace; font-size: 20px; font-weight: 700; color: var(--mat); margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 20px; }
.result-score-big { font-size: 48px; font-weight: 900; color: var(--mat); line-height: 1; }
.result-score-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; margin-bottom: 20px; }
.btn-restart { font-family: "Baloo 2", cursive; font-size: 14px; font-weight: 800; padding: 12px 32px; border-radius: 999px; border: none; background: linear-gradient(135deg,#059669,#34D399); color: white; cursor: pointer; box-shadow: 0 4px 12px rgba(5,150,105,.3); }

@media (max-width: 480px) {
  .sentence-text { font-size: 14px; }
  .opt-chip { font-size: 12px; padding: 6px 13px; }
  .blank { min-width: 110px; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../index.html" onclick="voltarAoPortal(); return false;">← Voltar ao portal</a>
  <div class="card-header">
    <div class="hicon">✏️</div>
    <div><h1>Complete a Lacuna</h1><p>Circunferência e Círculo — 5º Ano</p></div>
    <div class="hbadge">8 frases</div>
  </div>
  <div class="activity-body">
    <div class="prog-wrap">
      <div class="prog-info">
        <span class="prog-label" id="prog-label">Frase 1 de 8</span>
        <span class="prog-score" id="prog-score">0 acertos</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div id="activity-area">
      <div class="sentence-card">
        <div class="sentence-num" id="s-num">FRASE 1 / 8</div>
        <div class="sentence-text" id="s-text"></div>
      </div>
      <div class="options-row" id="opts-row"></div>
      <div class="feedback" id="feedback">
        <span class="feedback-icon" id="fb-icon"></span>
        <div id="fb-text"></div>
      </div>
      <div class="nav-row">
        <button class="btn-next" id="btn-next">Próxima →</button>
      </div>
    </div>

    <div class="result-panel" id="result-panel">
      <div class="result-emoji" id="res-emoji">🏆</div>
      <div class="result-title">Atividade concluída!</div>
      <div class="result-sub" id="res-sub"></div>
      <div class="result-score-big" id="res-pct"></div>
      <div class="result-score-label" id="res-label"></div>
      <button class="btn-restart" onclick="restartActivity()">Tentar novamente</button>
    </div>
  </div>
</div>

<script>
var lacunaItems = [
  {
    before: "A",
    blank: "circunferência",
    after: "é o conjunto dos pontos de um plano situados à mesma distância de um centro.",
    opts: ["circunferência", "círculo", "diâmetro", "raio"],
    feedback: "A circunferência é o conjunto dos pontos de um plano situados à mesma distância de um ponto dado, chamado de centro. O raio é a medida dessa distância."
  },
  {
    before: "O ponto fixo de onde parte a mesma distância até todos os pontos da circunferência é chamado de",
    blank: "centro",
    after: ".",
    opts: ["raio", "diâmetro", "centro", "compasso"],
    feedback: "O centro é o ponto do qual todos os pontos da circunferência estão à mesma distância. Indicamos o centro geralmente pela letra O."
  },
  {
    before: "O segmento que une o centro a qualquer ponto da circunferência é o",
    blank: "raio",
    after: "(r).",
    opts: ["diâmetro", "centro", "eixo", "raio"],
    feedback: "O raio (r) é o segmento que une o centro a qualquer ponto da circunferência. Todos os raios de uma mesma circunferência têm a mesma medida."
  },
  {
    before: "O segmento que une dois pontos da circunferência passando pelo centro é o",
    blank: "diâmetro",
    after: "(d).",
    opts: ["raio", "diâmetro", "centro", "compasso"],
    feedback: "O diâmetro (d) é o segmento que une dois pontos da circunferência, passando pelo centro. Por isso o diâmetro equivale a dois raios: d = 2 × r."
  },
  {
    before: "A fórmula que relaciona o diâmetro e o raio é: d =",
    blank: "2 × r",
    after: ".",
    opts: ["r + 2", "r ÷ 2", "2 × r", "r × r"],
    feedback: "A fórmula é d = 2 × r. O diâmetro é sempre o dobro do raio, pois ele corresponde a dois raios colocados um após o outro passando pelo centro."
  },
  {
    before: "O",
    blank: "círculo",
    after: "é a união da circunferência com a região interna por ela limitada.",
    opts: ["raio", "compasso", "diâmetro", "círculo"],
    feedback: "O círculo é a união da circunferência com a região interna. A circunferência é somente a linha curva fechada; o círculo inclui essa linha e todo o interior."
  },
  {
    before: "O instrumento utilizado para traçar circunferências é o",
    blank: "compasso",
    after: ".",
    opts: ["transferidor", "compasso", "esquadro", "régua"],
    feedback: "O compasso é o instrumento utilizado para traçar circunferências. Uma haste tem a ponta-seca (fixada no centro) e a outra tem o grafite que traça a circunferência ao girar."
  },
  {
    before: "Circunferências que têm o mesmo centro, mas raios diferentes, são chamadas de circunferências",
    blank: "concêntricas",
    after: ".",
    opts: ["paralelas", "simétricas", "concêntricas", "congruentes"],
    feedback: "Circunferências concêntricas têm o mesmo centro (ponto O), mas raios diferentes. O exemplo do livro mostra um aluno traçando duas circunferências concêntricas com raios de 1,5 cm e 3,0 cm."
  }
];

var lacunaCurrent = 0, lacunaScore = 0, lacunaAnswered = false;

function renderItem() {
  var item = lacunaItems[lacunaCurrent];
  document.getElementById('s-num').textContent = 'FRASE ' + (lacunaCurrent + 1) + ' / ' + lacunaItems.length;
  document.getElementById('prog-label').textContent = 'Frase ' + (lacunaCurrent + 1) + ' de ' + lacunaItems.length;
  document.getElementById('prog-fill').style.width = (lacunaCurrent / lacunaItems.length * 100) + '%';

  var sText = document.getElementById('s-text');
  sText.innerHTML = '';

  var before = document.createTextNode(item.before + ' ');
  sText.appendChild(before);

  var blankSpan = document.createElement('span');
  blankSpan.className = 'blank';
  blankSpan.id = 'blank-span';
  blankSpan.textContent = '________';
  sText.appendChild(blankSpan);

  var after = document.createTextNode(' ' + item.after);
  sText.appendChild(after);

  var optsRow = document.getElementById('opts-row');
  optsRow.innerHTML = '';
  item.opts.forEach(function(opt) {
    var chip = document.createElement('button');
    chip.className = 'opt-chip';
    chip.textContent = opt;
    chip.addEventListener('click', function() { selectOpt(opt, chip); });
    optsRow.appendChild(chip);
  });

  var fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  lacunaAnswered = false;
}

function selectOpt(chosen, chipEl) {
  if (lacunaAnswered) return;
  lacunaAnswered = true;

  var item = lacunaItems[lacunaCurrent];
  var isCorrect = (chosen === item.blank);
  if (isCorrect) lacunaScore++;

  var blankSpan = document.getElementById('blank-span');
  blankSpan.textContent = chosen;
  blankSpan.className = 'blank ' + (isCorrect ? 'filled-correct' : 'filled-wrong');

  document.getElementById('opts-row').querySelectorAll('.opt-chip').forEach(function(c) {
    c.disabled = true;
    if (c.textContent === item.blank && !isCorrect) {
      c.style.borderColor = '#059669';
      c.style.background = '#D1FAE5';
      c.style.color = '#064E3B';
    }
  });

  var fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.style.display = 'flex';
  document.getElementById('fb-icon').textContent = isCorrect ? '✓' : '✗';
  document.getElementById('fb-text').textContent = item.feedback;

  document.getElementById('prog-score').textContent = lacunaScore + (lacunaScore === 1 ? ' acerto' : ' acertos');
  document.getElementById('btn-next').style.display = 'block';
}

document.getElementById('btn-next').addEventListener('click', function() {
  lacunaCurrent++;
  if (lacunaCurrent < lacunaItems.length) {
    renderItem();
  } else {
    showResult();
  }
});

function showResult() {
  var total = lacunaItems.length;
  var pct = Math.round((lacunaScore / total) * 100);
  window.sabendoScore = pct;

  document.getElementById('activity-area').style.display = 'none';
  var rp = document.getElementById('result-panel');
  rp.style.display = 'block';

  var emoji = pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '📚';
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-sub').textContent = lacunaScore + ' de ' + total + ' frases corretas';
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = 'Concluído!';

  var msg = pct >= 80 ? 'Parabéns! Você conhece bem a terminologia!' : pct >= 60 ? 'Bom trabalho! Revise os termos que errou.' : 'Revise as definições de raio, diâmetro e círculo.';
  document.getElementById('res-label').textContent = msg;
}

function restartActivity() {
  lacunaCurrent = 0; lacunaScore = 0;
  document.getElementById('activity-area').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('prog-score').textContent = '0 acertos';
  renderItem();
}

renderItem();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/gamification.js"></script>
<script>
(function() {
  var SUPA_URL = "https://mmtrzxmitklpibfilbio.supabase.co";
  var SUPA_KEY = "sb_publishable_ZgA70ikD1XRgEhxzz7aKzQ_TNSAsxQ_";
  var DISCIPLINE = "mat";
  var THEME_SLUG = "circunferencia-circulo";
  var ACTIVITY_TYPE = "complete-lacuna";
  var supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  var GAMI_CONFIG = {
    characterName: "Circo",
    characterEmoji: "⭕",
    characterImg:   "chars/circunferencia-circulo-hd.png",
    themeLabel:     "Circunferência e Círculo · Matemática",
    totalActivities: 4,
    primaryColor: "#059669",
    lightColor: "#34D399",
    bgColor: "#ECFDF5",
    glowRgb: "5,150,105",
    backUrl: "../../index.html#theme-mat-circunferencia-circulo",
    activityType: ACTIVITY_TYPE,
  };

  var btn = document.createElement("button");
  btn.id = "concluir-btn";
  btn.textContent = "Concluir atividade";
  btn.style.cssText = "display:none;position:fixed;bottom:24px;right:24px;z-index:9999;background:linear-gradient(135deg,#059669,#34D399);color:white;border:none;border-radius:50px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(5,150,105,.4);font-family:sans-serif;transition:all .2s;";
  document.body.appendChild(btn);

  var _capturedScore = null;
  function showBtn() {
    if (typeof window._sabendoScoreInternal !== "number") return;
    if (btn.style.display === "none") {
      _capturedScore = Math.round(window._sabendoScoreInternal);
      btn.style.display = "block";
    }
  }

  var _sabendoScoreInternal = null;
  try {
    Object.defineProperty(window, 'sabendoScore', {
      configurable: true,
      get: function() { return _sabendoScoreInternal; },
      set: function(v) {
        _sabendoScoreInternal = v;
        window._sabendoScoreInternal = v;
        showBtn();
      }
    });
  } catch(e) {}

  document.addEventListener('sabendo:criador-done', function() {
    window._sabendoScoreInternal = 100;
    showBtn();
  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      var el = m.target;
      if (m.attributeName === "style" && el.style && el.style.display === "block") {
        var sig = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig)) showBtn();
      }
      if (m.attributeName === "class" && el.classList && el.classList.contains("show")) {
        var sig2 = (el.id || "") + " " + (el.className || "");
        if (/result|score|gabarito|feedback|correc/i.test(sig2)) showBtn();
      }
    });
  });
  observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class","style"] });

  btn.addEventListener("click", async function() {
    btn.textContent = "Registrando...";
    btn.disabled = true;

    var res = await supa.auth.getSession();
    var session = res.data.session;
    if (!session) {
      btn.textContent = "Faca login no portal";
      btn.style.background = "#EF4444";
      setTimeout(function() { btn.textContent = "Concluir atividade"; btn.style.background = "linear-gradient(135deg,#059669,#34D399)"; btn.disabled = false; }, 3000);
      return;
    }

    var uid = session.user.id;
    var scoreVal = _capturedScore;
    var today = new Date().toISOString().split("T")[0];

    var existCheck = await supa.from("activity_log")
      .select("id").eq("user_id", uid).eq("theme_slug", THEME_SLUG).eq("activity_type", ACTIVITY_TYPE).limit(1);
    var isFirst = !existCheck.data || existCheck.data.length === 0;

    await supa.from("activity_log").insert({
      user_id: uid, discipline: DISCIPLINE, theme_slug: THEME_SLUG,
      activity_type: ACTIVITY_TYPE, score: scoreVal, is_first_attempt: isFirst
    });

    var sr = await supa.from("streaks").select("*").eq("user_id", uid).single();
    if (sr.data) {
      var s = sr.data;
      var yest = new Date(); yest.setDate(yest.getDate() - 1);
      var yStr = yest.toISOString().split("T")[0];
      var ns = (s.last_activity_date === today) ? s.current_streak : (s.last_activity_date === yStr) ? s.current_streak + 1 : 1;
      await supa.from("streaks").update({ current_streak: ns, longest_streak: Math.max(ns, s.longest_streak), last_activity_date: today, total_activities: s.total_activities + 1, updated_at: new Date().toISOString() }).eq("user_id", uid);
    }

    btn.style.display = "none";

    if (window.SabendoGamification) {
      await SabendoGamification.run(supa, uid, THEME_SLUG, DISCIPLINE, GAMI_CONFIG);
    }
  });
})();
</script>
