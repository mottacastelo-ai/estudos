<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mockup — Cartas sabendo.</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #080612;
  font-family: "Baloo 2", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  gap: 48px; padding: 48px 24px;
  min-height: 100vh;
}
h2 {
  font-family: "Space Mono", monospace;
  font-size: 11px; color: rgba(255,255,255,.3);
  text-transform: uppercase; letter-spacing: .15em;
}

/* ── Linha de cartas ── */
.row { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }

/* ── Card base ── */
.card-wrap {
  position: relative;
  width: 280px; height: 392px; /* 400x560 escalado a 70% */
  border-radius: 17px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
}
.card-wrap:hover { transform: translateY(-8px) scale(1.03); }

/* Fundo gerado pelo Codex */
.card-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  border-radius: 17px;
}

/* Zona do personagem */
.card-char {
  position: absolute;
  top: 22px; left: 50%;
  transform: translateX(-50%);
  width: 176px; height: 196px; /* ~220x240 a 80% */
  display: flex; align-items: center; justify-content: center;
}
.card-char img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,.6));
}

/* Painel inferior */
.card-panel {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 156px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 0 16px 14px;
  gap: 4px;
}

/* Nome do personagem */
.card-name {
  font-family: "Baloo 2", sans-serif;
  font-size: 15px; font-weight: 900;
  text-align: center; line-height: 1.1;
}

/* Tema */
.card-theme {
  font-size: 10px; font-weight: 700;
  text-align: center; opacity: .7;
  text-transform: uppercase; letter-spacing: .08em;
}

/* Score */
.card-score {
  font-family: "Space Mono", monospace;
  font-size: 10px; font-weight: 700;
  margin-top: 2px;
}

/* Badge de raridade */
.card-badge {
  position: absolute;
  top: 230px; right: 14px;
  font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 99px;
  font-family: "Space Mono", monospace;
  letter-spacing: .04em;
}

/* Logo sabendo. */
.card-logo {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.card-logo img {
  height: 18px; width: auto;
  object-fit: contain;
}
.card-logo-text {
  font-family: "Space Mono", monospace;
  font-weight: 700; font-size: 11px;
  letter-spacing: -.01em;
}
.card-logo-dot { display: inline-block; }

/* ════════════════════════════════════════
   COMUM
════════════════════════════════════════ */
.card-comum .card-bg {
  background-image: url('_landing/cartas/carta-fundo-comum.png');
  box-shadow: 0 0 0 1px rgba(167,139,250,.15);
}
.card-comum:hover {
  box-shadow: 0 24px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(167,139,250,.25);
}
.card-comum .card-name  { color: #E5E0FF; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
.card-comum .card-theme { color: #A78BFA; }
.card-comum .card-score { color: rgba(255,255,255,.5); }
.card-comum .card-badge {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  color: #cbd5e1;
}
.card-comum .card-logo-text { color: rgba(255,255,255,.7); }
.card-comum .card-logo-dot  { color: #2DD4BF; }

/* ════════════════════════════════════════
   RARA
════════════════════════════════════════ */
.card-rara .card-bg {
  background-color: #0a1628;
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(37,99,235,.35) 0%, transparent 65%),
    linear-gradient(160deg, #0a1628, #1e3a8a 60%, #0f172a);
}
.card-rara:hover {
  box-shadow: 0 24px 56px rgba(37,99,235,.4), 0 0 0 1.5px rgba(96,165,250,.5);
}
.card-rara .card-name  {
  color: #fff;
  text-shadow: 0 0 20px rgba(96,165,250,.8), 0 2px 8px rgba(0,0,0,.8);
}
.card-rara .card-theme { color: #60A5FA; }
.card-rara .card-score { color: rgba(147,197,253,.7); }
.card-rara .card-badge {
  background: rgba(37,99,235,.4);
  border: 1px solid #3B82F6;
  color: #93C5FD;
  box-shadow: 0 0 12px rgba(59,130,246,.4);
}
.card-rara .card-logo-text {
  color: #93C5FD;
  text-shadow: 0 0 12px rgba(59,130,246,.6);
}
.card-rara .card-logo-dot { color: #2DD4BF; }

/* ════════════════════════════════════════
   EPICA
════════════════════════════════════════ */
.card-epica .card-bg {
  background-color: #0d0b1a;
  background-image:
    radial-gradient(ellipse at 30% 70%, rgba(76,29,149,.6) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 20%, rgba(124,58,237,.4) 0%, transparent 50%),
    linear-gradient(160deg, #0d0b1a, #2d1b69 70%, #1e1b4b);
}
.card-epica:hover {
  box-shadow: 0 24px 60px rgba(124,58,237,.55), 0 0 0 2px rgba(167,139,250,.6);
}
.card-epica .card-name {
  color: #fff;
  text-shadow: 0 0 24px rgba(167,139,250,.9), 0 2px 8px rgba(0,0,0,.9);
}
.card-epica .card-theme { color: #A78BFA; }
.card-epica .card-score { color: rgba(196,181,253,.7); }
.card-epica .card-badge {
  background: rgba(124,58,237,.45);
  border: 1px solid #7C3AED;
  color: #C4B5FD;
  box-shadow: 0 0 16px rgba(124,58,237,.6);
}
.card-epica .card-logo-text {
  color: #C4B5FD;
  text-shadow: 0 0 16px rgba(167,139,250,.8), 0 0 32px rgba(124,58,237,.5);
}
.card-epica .card-logo-dot { color: #2DD4BF; }

/* ════════════════════════════════════════
   LENDARIA
════════════════════════════════════════ */
.card-lendaria .card-bg {
  background-color: #0d0b1a;
  background-image:
    radial-gradient(ellipse at 60% 45%, rgba(245,158,11,.25) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 80%, rgba(124,58,237,.4) 0%, transparent 50%),
    linear-gradient(135deg, #0d0b1a 0%, #1e1b4b 40%, #78350f 100%);
}
.card-lendaria:hover {
  box-shadow: 0 28px 64px rgba(245,158,11,.45), 0 0 0 2px rgba(252,211,77,.7);
}
.card-lendaria .card-name {
  background: linear-gradient(135deg, #FCD34D, #F59E0B, #FCD34D);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(245,158,11,.8));
}
.card-lendaria .card-theme { color: #FCD34D; opacity: .8; }
.card-lendaria .card-score { color: rgba(252,211,77,.65); }
.card-lendaria .card-badge {
  background: linear-gradient(135deg, rgba(245,158,11,.5), rgba(234,88,12,.4));
  border: 1px solid #F59E0B;
  color: #FCD34D;
  box-shadow: 0 0 20px rgba(245,158,11,.6);
}
.card-lendaria .card-logo-text {
  background: linear-gradient(90deg, #FCD34D, #F59E0B, #FCD34D);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 8px rgba(245,158,11,.9));
}
.card-lendaria .card-logo-dot { color: #2DD4BF; }

/* Shimmer animado na Lendária */
.card-lendaria::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 17px;
  background: linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,255,255,.07) 45%,
    rgba(255,220,100,.12) 50%,
    rgba(255,255,255,.07) 55%,
    transparent 70%
  );
  background-size: 200% 200%;
  animation: shimmer 3s ease infinite;
  pointer-events: none;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
</style>
</head>
<body>

<h2>Mockup — Cartas sabendo. · composição em código</h2>

<div class="row">

  <!-- COMUM -->
  <div class="card-wrap card-comum">
    <div class="card-bg"></div>
    <div class="card-char">
      <img src="_landing/prepo-hd.png" alt="Prepo">
    </div>
    <div class="card-badge">⚪ Comum</div>
    <div class="card-panel">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 65%</div>
      <div class="card-logo">
        <img src="_landing/prepo-hd.png" alt="" style="height:14px;opacity:.6;filter:saturate(0) brightness(2)">
        <span class="card-logo-text">sabendo<span class="card-logo-dot">.</span></span>
      </div>
    </div>
  </div>

  <!-- RARA -->
  <div class="card-wrap card-rara">
    <div class="card-bg"></div>
    <div class="card-char">
      <img src="_landing/prepo-hd.png" alt="Prepo">
    </div>
    <div class="card-badge">🔵 Rara</div>
    <div class="card-panel">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 78%</div>
      <div class="card-logo">
        <img src="_landing/prepo-hd.png" alt="" style="height:14px;filter:saturate(0) brightness(2)">
        <span class="card-logo-text">sabendo<span class="card-logo-dot">.</span></span>
      </div>
    </div>
  </div>

  <!-- EPICA -->
  <div class="card-wrap card-epica">
    <div class="card-bg"></div>
    <div class="card-char">
      <img src="_landing/prepo-hd.png" alt="Prepo">
    </div>
    <div class="card-badge">🟣 Épica</div>
    <div class="card-panel">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 92%</div>
      <div class="card-logo">
        <img src="_landing/prepo-hd.png" alt="" style="height:14px;filter:saturate(0) brightness(2)">
        <span class="card-logo-text">sabendo<span class="card-logo-dot">.</span></span>
      </div>
    </div>
  </div>

  <!-- LENDARIA -->
  <div class="card-wrap card-lendaria">
    <div class="card-bg"></div>
    <div class="card-char">
      <img src="_landing/prepo-hd.png" alt="Prepo">
    </div>
    <div class="card-badge">🌟 Lendária</div>
    <div class="card-panel">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 97%</div>
      <div class="card-logo">
        <img src="_landing/prepo-hd.png" alt="" style="height:14px;filter:saturate(0) brightness(2)">
        <span class="card-logo-text">sabendo<span class="card-logo-dot">.</span></span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
