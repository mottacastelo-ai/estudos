<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mockup — Cartas sabendo.</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #05040f;
  font-family: "Baloo 2", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  gap: 56px; padding: 56px 32px; min-height: 100vh;
}
h2 {
  font-family: "Space Mono", monospace;
  font-size: 10px; color: rgba(255,255,255,.25);
  text-transform: uppercase; letter-spacing: .18em;
}

.row { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }

/* ══════════════════════════════════════════
   ESTRUTURA DA CARTA
   280 × 400px — proporção 7:10
══════════════════════════════════════════ */
.card {
  position: relative;
  width: 280px; height: 400px;
  border-radius: 20px;
  overflow: visible; /* personagem vai transbordar pelo topo */
  cursor: pointer;
  transition: transform .35s cubic-bezier(.22,1,.36,1);
  margin-top: 64px; /* espaço para o personagem transbordar */
}
.card:hover { transform: translateY(-12px) rotate(-1deg) scale(1.04); }

/* Frame interno (o "corpo" da carta com fundo) */
.card-frame {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  overflow: hidden;
}

/* Fundo Codex — quando não existe usa fallback CSS */
.card-frame-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
}

/* Overlay de profundidade — garante legibilidade do texto */
.card-frame-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    transparent 45%,
    rgba(5,4,15,.7) 65%,
    rgba(5,4,15,.95) 100%
  );
}

/* Personagem — transborda pelo topo, centrado */
.card-char {
  position: absolute;
  bottom: 140px; /* âncora no painel */
  left: 50%; transform: translateX(-50%);
  width: 220px; height: 260px;
  z-index: 10;
  pointer-events: none;
}
.card-char img {
  width: 100%; height: 100%;
  object-fit: contain;
}

/* Painel de info — fixo no rodapé */
.card-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 148px;
  z-index: 11;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 48px 18px 16px; /* 48px de topo deixa espaço para os pés do personagem */
  gap: 2px;
}

.card-name {
  font-size: 22px; font-weight: 900;
  line-height: 1; text-align: center;
}
.card-theme {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  opacity: .65; text-align: center;
}
.card-score {
  font-family: "Space Mono", monospace;
  font-size: 10px; font-weight: 700;
  margin-top: 3px;
}

/* Logo sabendo. */
.card-logo {
  margin-top: auto;
  font-family: "Space Mono", monospace;
  font-size: 11px; font-weight: 700;
  letter-spacing: -.01em;
}

/* Badge — canto superior direito do frame */
.card-badge {
  position: absolute;
  top: 14px; right: 14px;
  font-family: "Space Mono", monospace;
  font-size: 10px; font-weight: 700;
  padding: 4px 10px; border-radius: 99px;
  z-index: 12;
  letter-spacing: .04em;
}

/* Borda exterior da carta (anel) */
.card-ring {
  position: absolute; inset: -2px;
  border-radius: 22px;
  z-index: -1;
}

/* ══════════════════════════════════════════
   COMUM
══════════════════════════════════════════ */
.comum .card-frame-bg {
  background-image: url('_landing/cartas/carta-fundo-comum.png');
  background-color: #1A1035;
}
.comum .card-ring {
  background: linear-gradient(135deg, #6B7280, #374151, #9CA3AF);
}
.comum .card-char img {
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.7));
}
.comum .card-name  { color: #E5E0FF; }
.comum .card-theme { color: #A78BFA; }
.comum .card-score { color: rgba(255,255,255,.4); }
.comum .card-badge {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #94A3B8;
}
.comum .card-logo { color: rgba(255,255,255,.55); }
.comum .card-logo span { color: #2DD4BF; }

/* ══════════════════════════════════════════
   RARA
══════════════════════════════════════════ */
.rara .card-frame-bg {
  background: linear-gradient(160deg, #0a1628 0%, #1e3a8a 55%, #0f1f4a 100%);
}
/* Efeito holográfico */
.rara .card-frame-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 8px,
    rgba(59,130,246,.06) 8px,
    rgba(59,130,246,.06) 9px
  );
}
.rara .card-ring {
  background: linear-gradient(135deg, #60A5FA, #1D4ED8, #93C5FD, #2563EB);
  box-shadow: 0 0 24px rgba(37,99,235,.5);
}
.rara .card-char img {
  filter: drop-shadow(0 0 20px rgba(96,165,250,.5)) drop-shadow(0 8px 24px rgba(0,0,0,.7));
}
.rara .card-name  { color: #fff; text-shadow: 0 0 20px rgba(96,165,250,.7); }
.rara .card-theme { color: #60A5FA; }
.rara .card-score { color: rgba(147,197,253,.6); }
.rara .card-badge {
  background: rgba(37,99,235,.45); border: 1px solid #3B82F6; color: #93C5FD;
  box-shadow: 0 0 12px rgba(59,130,246,.5);
}
.rara .card-logo { color: #93C5FD; text-shadow: 0 0 12px rgba(59,130,246,.5); }
.rara .card-logo span { color: #2DD4BF; }

/* ══════════════════════════════════════════
   EPICA
══════════════════════════════════════════ */
.epica .card-frame-bg {
  background: linear-gradient(160deg, #0d0b1a 0%, #2d1b69 50%, #1e1b4b 100%);
}
.epica .card-frame-bg::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 25% 75%, rgba(76,29,149,.7) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 25%, rgba(124,58,237,.5) 0%, transparent 50%);
}
.epica .card-ring {
  background: linear-gradient(135deg, #A78BFA, #6D28D9, #C4B5FD, #7C3AED);
  box-shadow: 0 0 32px rgba(124,58,237,.65);
}
.epica .card-char img {
  filter: drop-shadow(0 0 28px rgba(167,139,250,.65)) drop-shadow(0 8px 24px rgba(0,0,0,.8));
}
.epica .card-name  {
  color: #fff;
  text-shadow: 0 0 24px rgba(167,139,250,.9), 0 0 48px rgba(124,58,237,.5);
}
.epica .card-theme { color: #A78BFA; }
.epica .card-score { color: rgba(196,181,253,.6); }
.epica .card-badge {
  background: rgba(109,40,217,.5); border: 1px solid #7C3AED; color: #C4B5FD;
  box-shadow: 0 0 16px rgba(124,58,237,.65);
}
.epica .card-logo { color: #C4B5FD; text-shadow: 0 0 16px rgba(167,139,250,.7); }
.epica .card-logo span { color: #2DD4BF; }

/* ══════════════════════════════════════════
   LENDARIA
══════════════════════════════════════════ */
.lendaria .card-frame-bg {
  background: linear-gradient(135deg, #0d0b1a 0%, #1e1b4b 35%, #7c2d12 70%, #451a03 100%);
}
.lendaria .card-frame-bg::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 60% 40%, rgba(245,158,11,.3) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 70%, rgba(124,58,237,.4) 0%, transparent 45%);
}
.lendaria .card-ring {
  background: linear-gradient(135deg, #FCD34D, #B45309, #FDE68A, #92400E, #FCD34D);
  box-shadow: 0 0 40px rgba(245,158,11,.7), 0 0 80px rgba(245,158,11,.25);
}
.lendaria .card-char img {
  filter:
    drop-shadow(0 0 30px rgba(245,158,11,.6))
    drop-shadow(0 0 60px rgba(245,158,11,.25))
    drop-shadow(0 8px 24px rgba(0,0,0,.9));
}
.lendaria .card-name {
  background: linear-gradient(135deg, #FDE68A, #F59E0B, #FDE68A);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 12px rgba(245,158,11,.8));
}
.lendaria .card-theme { color: #FCD34D; }
.lendaria .card-score { color: rgba(252,211,77,.6); }
.lendaria .card-badge {
  background: linear-gradient(135deg, rgba(245,158,11,.5), rgba(180,83,9,.5));
  border: 1px solid #F59E0B; color: #FDE68A;
  box-shadow: 0 0 20px rgba(245,158,11,.7);
}
.lendaria .card-logo {
  background: linear-gradient(90deg, #FDE68A, #F59E0B, #FDE68A);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 8px rgba(245,158,11,.9));
}
.lendaria .card-logo span {
  background: none; -webkit-text-fill-color: #2DD4BF; filter: none;
}

/* Shimmer Lendária */
.lendaria .card-frame::after {
  content: '';
  position: absolute; inset: 0; border-radius: 20px;
  background: linear-gradient(
    105deg,
    transparent 25%, rgba(255,220,100,.08) 40%,
    rgba(255,255,255,.12) 50%, rgba(255,220,100,.08) 60%, transparent 75%
  );
  background-size: 300% 100%;
  animation: shimmer 2.5s ease-in-out infinite;
  pointer-events: none; z-index: 9;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
</style>
</head>
<body>

<h2>Mockup — Cartas sabendo. · estrutura redesenhada</h2>

<div class="row">

  <!-- COMUM -->
  <div class="card comum">
    <div class="card-ring"></div>
    <div class="card-frame">
      <div class="card-frame-bg"></div>
      <div class="card-frame-overlay"></div>
    </div>
    <div class="card-char"><img src="_landing/prepo-hd.png" alt="Prepo"></div>
    <div class="card-badge">⚪ Comum</div>
    <div class="card-info">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 65%</div>
      <div class="card-logo">sabendo<span>.</span></div>
    </div>
  </div>

  <!-- RARA -->
  <div class="card rara">
    <div class="card-ring"></div>
    <div class="card-frame">
      <div class="card-frame-bg"></div>
      <div class="card-frame-overlay"></div>
    </div>
    <div class="card-char"><img src="_landing/prepo-hd.png" alt="Prepo"></div>
    <div class="card-badge">🔵 Rara</div>
    <div class="card-info">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 79%</div>
      <div class="card-logo">sabendo<span>.</span></div>
    </div>
  </div>

  <!-- EPICA -->
  <div class="card epica">
    <div class="card-ring"></div>
    <div class="card-frame">
      <div class="card-frame-bg"></div>
      <div class="card-frame-overlay"></div>
    </div>
    <div class="card-char"><img src="_landing/prepo-hd.png" alt="Prepo"></div>
    <div class="card-badge">🟣 Épica</div>
    <div class="card-info">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 92%</div>
      <div class="card-logo">sabendo<span>.</span></div>
    </div>
  </div>

  <!-- LENDARIA -->
  <div class="card lendaria">
    <div class="card-ring"></div>
    <div class="card-frame">
      <div class="card-frame-bg"></div>
      <div class="card-frame-overlay"></div>
    </div>
    <div class="card-char"><img src="_landing/prepo-hd.png" alt="Prepo"></div>
    <div class="card-badge">🌟 Lendária</div>
    <div class="card-info">
      <div class="card-name">Prepo</div>
      <div class="card-theme">Preposições · Português</div>
      <div class="card-score">Acerto: 97%</div>
      <div class="card-logo">sabendo<span>.</span></div>
    </div>
  </div>

</div>
</body>
</html>
