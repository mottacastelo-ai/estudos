<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — O Lixo que Produzimos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --primary:#0284C7; --light:#38BDF8; --bg:#F0F9FF; --green:#15803D; --correct:#16a34a; --wrong:#dc2626; --neutral:#64748b; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Baloo 2',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,#0C4A6E,#0284C7 60%,#38BDF8);color:white;padding:24px 20px;text-align:center;}
.char{font-size:3rem;display:block;margin-bottom:8px;}
header h1{font-size:1.6rem;font-weight:900;margin-bottom:4px;}
header p{font-size:.95rem;opacity:.85;}
.container{max-width:720px;margin:0 auto;padding:24px 16px;flex:1;}
.progress-bar{background:#cbd5e1;border-radius:99px;height:10px;margin-bottom:6px;}
.progress-fill{background:var(--primary);height:100%;border-radius:99px;transition:width .4s;}
.progress-label{font-size:.8rem;color:var(--neutral);margin-bottom:20px;font-family:'Space Mono',monospace;}
.question-card{background:white;border-radius:20px;padding:28px 24px;box-shadow:0 4px 20px rgba(2,132,199,.1);margin-bottom:20px;}
.q-number{font-size:.75rem;font-family:'Space Mono',monospace;color:var(--primary);font-weight:700;margin-bottom:10px;}
.q-text{font-size:1.1rem;font-weight:700;color:#1e293b;line-height:1.5;margin-bottom:20px;}
.options{display:flex;flex-direction:column;gap:10px;}
.option-btn{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:14px 18px;font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:600;color:#334155;cursor:pointer;text-align:left;transition:all .2s;}
.option-btn:hover:not(:disabled){border-color:var(--light);background:#e0f2fe;color:var(--primary);}
.option-btn.correct{background:#dcfce7;border-color:var(--correct);color:var(--correct);}
.option-btn.wrong{background:#fee2e2;border-color:var(--wrong);color:var(--wrong);}
.option-btn:disabled{cursor:default;}
.feedback-box{margin-top:16px;padding:14px 18px;border-radius:12px;font-weight:600;font-size:.95rem;display:none;}
.feedback-box.show{display:block;}
.feedback-box.ok{background:#dcfce7;color:#166534;}
.feedback-box.nok{background:#fee2e2;color:#991b1b;}
.nav-btn{background:var(--primary);color:white;border:none;border-radius:12px;padding:14px 28px;font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;display:block;margin:0 auto;transition:opacity .2s;}
.nav-btn:hover{opacity:.88;}
.nav-btn:disabled{opacity:.4;cursor:default;}
.result-card{background:white;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 4px 20px rgba(2,132,199,.15);display:none;}
.result-card.show{display:block;}
.result-emoji{font-size:5rem;margin-bottom:16px;display:block;}
.result-title{font-size:1.8rem;font-weight:900;color:#1e293b;margin-bottom:8px;}
.result-score{font-size:3rem;font-weight:900;color:var(--primary);margin:12px 0;}
.result-msg{font-size:1rem;color:#475569;margin-bottom:28px;line-height:1.6;}
.back-btn{background:var(--green);color:white;border:none;border-radius:12px;padding:14px 28px;font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;margin-right:12px;}
.retry-btn{background:var(--primary);color:white;border:none;border-radius:12px;padding:14px 28px;font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;}
footer{text-align:center;padding:16px;font-size:.8rem;color:var(--neutral);}
</style>
</head>
<body>
<header>
  <span class="char">🔬🗑️</span>
  <h1>Quiz — O Lixo que Produzimos</h1>
  <p>Prof. Ciência quer saber: você domina o Capítulo 5? 10 perguntas!</p>
</header>
<div class="container">
  <div id="quiz-area">
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">Questão 1 de 10</div>
    <div class="question-card">
      <div class="q-number" id="q-number">QUESTÃO 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback-box" id="feedback"></div>
    </div>
    <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>Próxima →</button>
  </div>
  <div class="result-card" id="result-card">
    <span class="result-emoji" id="result-emoji"></span>
    <div class="result-title">Quiz concluído!</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="back-btn" onclick="window.close()">← Voltar ao Portal</button>
    <button class="retry-btn" onclick="restartQuiz()">Tentar novamente</button>
  </div>
</div>
<footer>Portal Educacional 5º Ano • Ciências — O Lixo que Produzimos</footer>
<script>
const questions=[
  {text:"O que são chamados de 'resíduos' no contexto do lixo?",options:["Materiais que ainda têm utilidade e valor","Substâncias químicas usadas em indústrias","Tudo aquilo que não é mais considerado útil e é descartado","Apenas o lixo orgânico, como restos de alimentos"],correct:2,feedback:"Correto! Resíduos são tudo o que não é mais considerado útil pelas pessoas e é jogado fora — independente do material."},
  {text:"Um celular quebrado, pilhas usadas e um computador antigo pertencem a qual tipo de lixo?",options:["Lixo domiciliar","Lixo eletrônico","Lixo industrial","Lixo dos serviços de saúde"],correct:1,feedback:"Correto! Eletrônicos como celulares, pilhas e computadores formam o lixo eletrônico. Aparelhos e pilhas velhos possuem metais tóxicos e exigem descarte especializado."},
  {text:"Qual é o principal risco do lixo dos serviços de saúde descartado incorretamente?",options:["Poluição visual das cidades","Risco de infecção e contaminação biológica","Aumento do volume de aterros sanitários","Produção de gases tóxicos no ar"],correct:1,feedback:"Correto! O lixo de hospitais e clínicas apresenta risco de infecção e acidentes biológicos — por isso usa sacos vermelhos com símbolo de biohazard."},
  {text:"Sucata metálica, resíduos de máquinas e tambores com substâncias químicas são exemplos de qual tipo de lixo?",options:["Lixo domiciliar","Lixo eletrônico","Lixo dos serviços de saúde","Lixo industrial"],correct:3,feedback:"Exato! O lixo industrial vem de fábricas e indústrias — pode conter metais, químicos perigosos e outros resíduos específicos da produção."},
  {text:"Por que o consumo crescente de produtos industrializados agrava o problema do lixo?",options:["Porque os produtos industrializados são mais caros","Porque suas embalagens, na maioria das vezes, vão para o lixo e demoram muito para se decompor","Porque são feitos de materiais que não podem ser reciclados","Porque ocupam muito espaço nos supermercados"],correct:1,feedback:"Correto! As embalagens de produtos industrializados representam grande parte do lixo gerado — e muitas demoram centenas de anos para se decompor no ambiente."},
  {text:"Segundo o livro, um cidadão brasileiro é responsável por aproximadamente quanto lixo por ano?",options:["78 quilogramas","178 quilogramas","378 quilogramas","578 quilogramas"],correct:2,feedback:"Correto! Segundo a reportagem 'Os desafios da era do lixo' (Veja, 2011), cada brasileiro é responsável por cerca de 378 quilogramas de lixo por ano — mais de 1 kg por dia!"},
  {text:"A poluição da água dos rios e mares é causada principalmente por quê?",options:["Pelo excesso de chuvas e enchentes naturais","Pelo descarte de lixo e lançamento de esgoto sem tratamento","Pela evaporação excessiva da água em climas quentes","Pelo crescimento das cidades próximas a rios"],correct:1,feedback:"Correto! A poluição hídrica é causada principalmente pelo descarte de lixo e pelo lançamento de esgoto sem tratamento, proveniente de residências, comércios e indústrias."},
  {text:"Qual dos efeitos abaixo é causado pela poluição do ar nas pessoas?",options:["Melhora do sistema imunológico","Redução da pressão arterial","Tosse, irritação nos olhos e problemas respiratórios","Aumento da produção de vitamina D"],correct:2,feedback:"Correto! O ar poluído por gases de veículos e indústrias provoca tosse, irritação nos olhos e diversas doenças respiratórias — afetando pessoas, animais e plantas."},
  {text:"Qual das ações abaixo ajuda a REDUZIR a poluição do ar?",options:["Usar o carro individual todos os dias","Queimar lixo no quintal de casa","Usar transporte público como ônibus e metrô","Comprar mais produtos com embalagens descartáveis"],correct:2,feedback:"Exato! O transporte público reduz o número de carros nas ruas e, consequentemente, a quantidade de gases poluentes emitidos no ar."},
  {text:"O que significa 'reutilizar' materiais, segundo os cartazes apresentados no livro?",options:["Separar o lixo para a coleta seletiva","Comprar menos produtos no supermercado","Dar novos usos a materiais ou objetos que iriam para o lixo","Pesquisar o destino correto de cada tipo de resíduo"],correct:2,feedback:"Correto! Reutilizar é dar novos usos a objetos ou materiais que seriam descartados — como transformar uma caixa de leite em porta-lápis ou reaproveitar embalagens."}
];
let current=0,score=0,answered=false;
function renderQuestion(){
  const q=questions[current];
  document.getElementById('q-number').textContent=`QUESTÃO ${current+1}`;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('progress-label').textContent=`Questão ${current+1} de ${questions.length}`;
  document.getElementById('progress').style.width=`${(current/questions.length)*100}%`;
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';btn.textContent=opt;
    btn.onclick=()=>selectOption(i);opts.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback-box';
  document.getElementById('next-btn').disabled=true;answered=false;
}
function selectOption(idx){
  if(answered)return;answered=true;
  const q=questions[current];
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  btns[idx].classList.add(idx===q.correct?'correct':'wrong');
  if(idx!==q.correct)btns[q.correct].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(idx===q.correct){score++;fb.textContent='✅ '+q.feedback;fb.className='feedback-box ok show';}
  else{fb.textContent='❌ '+q.feedback;fb.className='feedback-box nok show';}
  document.getElementById('next-btn').disabled=false;
  if(current===questions.length-1)document.getElementById('next-btn').textContent='Ver resultado 🏆';
}
function nextQuestion(){current++;if(current>=questions.length)showResult();else renderQuestion();}
function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-card').classList.add('show');
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('result-score').textContent=`${score} / ${questions.length} (${pct}%)`;
  let emoji,msg;
  if(pct>=90){emoji='🌟';msg='Incrível! Você domina o tema. Continue assim e ensine o que aprendeu!';}
  else if(pct>=70){emoji='🔬';msg='Muito bem! Você entende bastante sobre o lixo que produzimos. Revise os pontos que errou!';}
  else if(pct>=50){emoji='🔍';msg='Bom esforço! Que tal rever a HQ e as atividades antes de tentar novamente?';}
  else{emoji='📚';msg='Continue estudando! Volte ao portal para reforçar o conteúdo.';}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-msg').textContent=msg;
}
function restartQuiz(){
  current=0;score=0;answered=false;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('next-btn').textContent='Próxima →';
  renderQuestion();
}
renderQuestion();
</script>
</body>
</html>
